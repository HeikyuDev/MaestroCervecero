# Local services for the dev and test profiles.
# Start: docker compose up -d mailpit
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: maestrocervecero-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web inbox: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 5000
