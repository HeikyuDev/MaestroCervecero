# ===================================================================
# PERFIL DE TESTS DE INTEGRACION (@ActiveProfiles("test"))
# ===================================================================
# Los tests que levantan Spring contra una base real usan SIEMPRE una base propia, nunca la de desarrollo.
# La URL se puede reemplazar con la variable de entorno SPRING_DATASOURCE_URL (por ejemplo en CI, donde el
# servicio postgres crea otra base); el usuario y la clave, con SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maestrocervecero_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:AdminCerveza}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Flyway crea el esquema y los datos iniciales; Hibernate solo valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
