# ===================================================================
# PERFIL DE DESARROLLO (dev)
# ===================================================================
# Trabajo diario y pruebas manuales en el navegador. Es el perfil por defecto (spring.profiles.default=dev):
# se usa cuando no se indica spring.profiles.active ni la variable de entorno SPRING_PROFILES_ACTIVE.

# URL de conexión: indica el motor (jdbc:postgresql), el servidor (localhost), el puerto (5432) y la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/maestrocervecero_dev

# Usuario con permisos de acceso a la base de datos
spring.datasource.username=AdminCerveza

# Contraseña del usuario de la base de datos
spring.datasource.password=admin

# Muestra en la consola de la aplicación las consultas SQL que Hibernate ejecuta en tiempo real
spring.jpa.show-sql=true
