<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#receta-detalle-content}, 'recetas')}">
<body>

<div id="receta-detalle-content" class="space-y-6" th:with="version=${receta.version}">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight" th:text="${version.nombre}">Pale Ale</h1>
            <p class="text-sm text-slate-500">Detalle de la receta con todos los datos de su versión vigente.</p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
            <a th:href="@{/recetas}"
               class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
                <i class="bi bi-arrow-left"></i> Volver al listado
            </a>
            <a th:href="@{/recetas/{id}/editar(id=${receta.id})}"
               class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
                <i class="bi bi-pencil-square"></i> Modificar
            </a>
        </div>
    </div>

    <!-- Datos generales, duraciones estimadas, maltas, lúpulos y levaduras -->
    <th:block th:replace="~{receta/receta-datos :: datos(${version}, ${receta.id})}"></th:block>
</div>

</body>
</html>
