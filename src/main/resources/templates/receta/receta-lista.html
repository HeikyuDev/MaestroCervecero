<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#receta-lista-content}, 'recetas')}">
<body>

<div id="receta-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Recetas</h1>
            <p class="text-sm text-slate-500">Recetas activas con los datos de su versión vigente, en orden alfabético.</p>
        </div>
        <a th:href="@{/recetas/nuevo}"
           class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nueva receta
        </a>
    </div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/recetas}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div class="md:col-span-2">
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off" placeholder="Ej: Pale Ale"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
            <a th:href="@{/recetas}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-3 whitespace-nowrap">Código</th>
                <th class="px-3 py-3 whitespace-nowrap">Nombre</th>
                <th class="px-3 py-3 whitespace-nowrap" title="Volumen base (L)">Vol. base (L)</th>
                <th class="px-3 py-3 whitespace-nowrap" title="OG objetivo">OG</th>
                <th class="px-3 py-3 whitespace-nowrap" title="FG objetivo">FG</th>
                <th class="px-3 py-3 whitespace-nowrap" title="IBU objetivo">IBU</th>
                <th class="px-3 py-3 text-right whitespace-nowrap">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="r : ${recetas.content}" class="hover:bg-slate-50">
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="'R' + ${r.id}">R7</td>
                <td class="px-3 py-3 font-medium text-slate-900 whitespace-nowrap" th:text="${r.version.nombre}">Pale Ale</td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${r.version.volumenBase})}"></th:block></td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: gravedad(${r.version.ogObjetivo})}"></th:block></td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: gravedad(${r.version.fgObjetivo})}"></th:block></td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${r.version.ibuObjetivo})}"></th:block></td>
                <td class="px-3 py-3">
                    <div class="flex items-center justify-end gap-0.5">
                        <a th:href="@{/recetas/{id}(id=${r.id})}" title="Ver detalle de la receta" aria-label="Ver detalle de la receta"
                           class="p-1.5 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-eye text-base"></i>
                        </a>
                        <a th:href="@{/recetas/{id}/editar(id=${r.id})}" title="Modificar receta" aria-label="Modificar receta"
                           class="p-1.5 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-base"></i>
                        </a>
                        <button type="button" title="Dar de baja receta" aria-label="Dar de baja receta"
                                th:data-baja-url="@{/recetas/{id}/baja(id=${r.id})}"
                                th:data-baja-nombre="${r.version.nombre}"
                                class="shrink-0 whitespace-nowrap p-1.5 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-base"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${recetas.empty}">
                <td colspan="7" class="px-4 py-10 text-center text-slate-400">
                    <i class="bi bi-journal-bookmark block text-3xl mb-2"></i>
                    No se encontraron recetas con los criterios indicados
                </td>
            </tr>
            </tbody>
        </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${recetas}, 'recetas',
                ${recetas.hasPrevious()} ? @{/recetas(pagina=${recetas.number - 1}, nombre=${filtroNombre})} : null,
                ${recetas.hasNext()} ? @{/recetas(pagina=${recetas.number + 1}, nombre=${filtroNombre})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja receta', 'Si tiene una planificación de producción pendiente, el sistema no lo permitirá.')}"></div>
</div>

</body>
</html>
