<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Filas de las tablas de maltas, lúpulos y levaduras del formulario de receta.

    Cada fila lleva sus datos en campos ocultos con el nombre indexado que espera el RecetaFormDTO
    (por ejemplo version.detallesMalta[0].idMalta). Las mismas filas se usan para pintar lo que ya
    tiene la receta (alta con errores, modificación) y como plantilla (<template>) que clona
    /js/receta-form.js al agregar una fila desde la ventana emergente:

      data-campo   campo oculto del DTO; /js/receta-form.js recalcula el índice del nombre.
      data-celda   celda visible; /js/receta-form.js escribe ahí el valor ingresado.

    Parámetros comunes: indice (posición en la lista), nombre (del insumo, null si ya no existe) y
    conError (true si el servidor rechazó algún campo de la fila: se resalta; la plantilla pasa false).
-->

<tr th:fragment="malta(indice, idMalta, nombre, cantidad, conError)" data-fila data-prefijo="version.detallesMalta" th:classappend="${conError} ? 'bg-rose-50'">
    <td class="px-4 py-3 font-medium text-slate-900">
        <input type="hidden" data-campo="idMalta" th:name="|version.detallesMalta[${indice}].idMalta|" th:value="${idMalta}">
        <input type="hidden" data-campo="cantidad" th:name="|version.detallesMalta[${indice}].cantidad|" th:value="${cantidad != null ? (cantidad == cantidad.intValue() ? cantidad.intValue() : cantidad) : null}">
        <span data-celda="nombre" th:text="${nombre != null} ? ${nombre} : 'Malta no disponible'">Pilsen</span>
    </td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="cantidad"><th:block th:replace="~{receta/formato :: medida(${cantidad}, 'kg')}"></th:block></td>
    <td class="col-acciones px-4 py-3 text-right">
        <button type="button" data-quitar-fila
                class="inline-flex items-center gap-1 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
            <i class="bi bi-trash"></i> Quitar
        </button>
    </td>
</tr>

<!-- conTiempo: el tiempo de hervor solo viaja en el uso Hervor; para los demás usos la celda muestra un guion -->
<tr th:fragment="lupulo(indice, idLupulo, nombre, cantidad, uso, etapaDeUso, tiempoDeHervor, conTiempo, conError)" data-fila data-prefijo="version.detallesLupulo" th:classappend="${conError} ? 'bg-rose-50'">
    <td class="px-4 py-3 font-medium text-slate-900">
        <input type="hidden" data-campo="idLupulo" th:name="|version.detallesLupulo[${indice}].idLupulo|" th:value="${idLupulo}">
        <input type="hidden" data-campo="cantidad" th:name="|version.detallesLupulo[${indice}].cantidad|" th:value="${cantidad != null ? (cantidad == cantidad.intValue() ? cantidad.intValue() : cantidad) : null}">
        <input type="hidden" data-campo="uso" th:name="|version.detallesLupulo[${indice}].uso|" th:value="${uso}">
        <input type="hidden" data-campo="etapaDeUso" th:name="|version.detallesLupulo[${indice}].etapaDeUso|" th:value="${etapaDeUso}">
        <input type="hidden" data-campo="tiempoDeHervor" th:if="${conTiempo}" th:name="|version.detallesLupulo[${indice}].tiempoDeHervor|" th:value="${tiempoDeHervor != null ? (tiempoDeHervor == tiempoDeHervor.intValue() ? tiempoDeHervor.intValue() : tiempoDeHervor) : null}">
        <span data-celda="nombre" th:text="${nombre != null} ? ${nombre} : 'Lúpulo no disponible'">Cascade</span>
    </td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="uso"><th:block th:replace="~{receta/formato :: usoLupulo(${uso})}"></th:block></td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="etapaDeUso"><th:block th:replace="~{receta/formato :: etapa(${etapaDeUso})}"></th:block></td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="tiempoDeHervor">
        <th:block th:if="${conTiempo}"><th:block th:replace="~{receta/formato :: medida(${tiempoDeHervor}, 'min')}"></th:block></th:block>
        <th:block th:unless="${conTiempo}">-</th:block>
    </td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="cantidad"><th:block th:replace="~{receta/formato :: medida(${cantidad}, 'g')}"></th:block></td>
    <td class="col-acciones px-4 py-3 text-right">
        <button type="button" data-quitar-fila
                class="inline-flex items-center gap-1 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
            <i class="bi bi-trash"></i> Quitar
        </button>
    </td>
</tr>

<tr th:fragment="levadura(indice, idLevadura, nombre, cantidad, conError)" data-fila data-prefijo="version.detallesLevadura" th:classappend="${conError} ? 'bg-rose-50'">
    <td class="px-4 py-3 font-medium text-slate-900">
        <input type="hidden" data-campo="idLevadura" th:name="|version.detallesLevadura[${indice}].idLevadura|" th:value="${idLevadura}">
        <input type="hidden" data-campo="cantidad" th:name="|version.detallesLevadura[${indice}].cantidad|" th:value="${cantidad != null ? (cantidad == cantidad.intValue() ? cantidad.intValue() : cantidad) : null}">
        <span data-celda="nombre" th:text="${nombre != null} ? ${nombre} : 'Levadura no disponible'">US-05</span>
    </td>
    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-celda="cantidad"><th:block th:replace="~{receta/formato :: medida(${cantidad}, 'g')}"></th:block></td>
    <td class="col-acciones px-4 py-3 text-right">
        <button type="button" data-quitar-fila
                class="inline-flex items-center gap-1 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
            <i class="bi bi-trash"></i> Quitar
        </button>
    </td>
</tr>

</html>
