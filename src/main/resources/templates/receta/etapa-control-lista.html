<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#etapa-control-lista-content}, 'recetas')}">
<body>

<div id="etapa-control-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Recetas</h1>
            <p class="text-sm text-slate-500">Recetas, etapas de control y parámetros de control del plan de monitoreo, en orden alfabético.</p>
        </div>
        <a th:href="@{/recetas/etapas-control/nuevo}"
           class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nueva etapa de control
        </a>
    </div>

    <div th:replace="~{receta/tabs :: tabs('etapas-control')}"></div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/recetas/etapas-control}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div>
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off" placeholder="Ej: Control de densidad"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="etapa" class="block text-xs font-medium text-slate-500 mb-1">Etapa a controlar</label>
            <select id="etapa" name="etapa"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todas</option>
                <option th:each="e : ${etapas}" th:value="${e}" th:selected="${e == filtroEtapa}">
                    <th:block th:replace="~{receta/formato :: etapa(${e})}"></th:block>
                </option>
            </select>
        </div>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
            <a th:href="@{/recetas/etapas-control}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Etapa a controlar</th>
                <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="x : ${etapasControl.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${x.nombre}">Control de densidad</td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="inline-block px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold"><th:block th:replace="~{receta/formato :: etapa(${x.etapaAControlar})}"></th:block></span>
                </td>
                <td class="px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                        <th:block th:replace="~{fragments/dialogo-descripcion :: boton(${x.nombre}, ${x.descripcion})}"></th:block>
                        <a th:href="@{/recetas/etapas-control/{id}/editar(id=${x.id})}" title="Editar etapa de control" aria-label="Editar etapa de control"
                           class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-lg"></i>
                        </a>
                        <button type="button" title="Dar de baja etapa de control" aria-label="Dar de baja etapa de control"
                                th:data-baja-url="@{/recetas/etapas-control/{id}/baja(id=${x.id})}"
                                th:data-baja-nombre="${x.nombre}"
                                class="p-2 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-lg"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${etapasControl.empty}">
                <td colspan="3" class="px-4 py-10 text-center text-slate-400">
                    <i class="bi bi-list-check block text-3xl mb-2"></i>
                    No se encontraron etapas de control con los criterios indicados.
                </td>
            </tr>
            </tbody>
        </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${etapasControl}, 'etapas de control',
                ${etapasControl.hasPrevious()} ? @{/recetas/etapas-control(pagina=${etapasControl.number - 1}, nombre=${filtroNombre}, etapa=${filtroEtapa})} : null,
                ${etapasControl.hasNext()} ? @{/recetas/etapas-control(pagina=${etapasControl.number + 1}, nombre=${filtroNombre}, etapa=${filtroEtapa})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-descripcion :: dialogo}"></div>
    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja etapa de control', 'Si está asociada al plan de monitoreo de una receta activa, el sistema no lo permitirá.')}"></div>
</div>

</body>
</html>
