<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#barril-form-content}, 'barriles')}">
<body>

<!-- editando = true cuando se modifica un barril existente (llega barrilId), false en el alta -->
<div id="barril-form-content" class="space-y-6" th:with="editando=${barrilId != null}">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i>
            <span>Volver a barriles</span>
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight"
            th:text="${editando} ? 'Editar barril' : 'Nuevo barril'">Nuevo barril</h1>
        <p class="text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form th:action="${editando} ? @{/barriles/{id}(id=${barrilId})} : @{/barriles}"
          th:object="${barrilForm}" method="post" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <!-- Resumen de todos los errores: campos inválidos (@Valid) y reglas de negocio del service -->
        <div th:replace="~{fragments/form-errors :: resumen(${editando} ? 'No se pudo modificar el barril' : 'No se pudo crear el barril')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Datos del barril</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="identificador" class="block text-sm font-medium text-slate-700 mb-1">Identificador <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="text" id="identificador" th:field="*{identificador}" autofocus autocomplete="off" placeholder="Ej: B-001"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('identificador')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('identificador')}" th:errors="*{identificador}" class="mt-1 text-xs text-rose-600"></p>
                    <p th:unless="${#fields.hasErrors('identificador')}" class="mt-1 text-xs text-slate-400">Único entre los barriles del mismo fabricante.</p>
                </div>

                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Fabricante <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idFabricanteBarril', *{idFabricanteBarril}, ${fabricanteSeleccionado},
                            @{/barriles/buscador/fabricantes}, null, null, false, ${#fields.hasErrors('idFabricanteBarril')}, 'Seleccione fabricante')}"></div>
                    <p th:if="${#fields.hasErrors('idFabricanteBarril')}" th:errors="*{idFabricanteBarril}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="capacidad" class="block text-sm font-medium text-slate-700 mb-1">Capacidad (L) <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="number" id="capacidad" th:field="*{capacidad}" min="0" step="any" autocomplete="off" placeholder="Ej: 50"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('capacidad')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}" class="mt-1 text-xs text-rose-600"></p>
                    <p th:unless="${#fields.hasErrors('capacidad')}" class="mt-1 text-xs text-slate-400">Un número mayor a 0.</p>
                </div>

                <div>
                    <label for="usosMaximosAntesMantenimiento" class="block text-sm font-medium text-slate-700 mb-1">Usos antes de mantenimiento <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="number" id="usosMaximosAntesMantenimiento" th:field="*{usosMaximosAntesMantenimiento}" min="1" step="1" autocomplete="off" placeholder="Ej: 100"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('usosMaximosAntesMantenimiento')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('usosMaximosAntesMantenimiento')}" th:errors="*{usosMaximosAntesMantenimiento}" class="mt-1 text-xs text-rose-600"></p>
                    <p th:unless="${#fields.hasErrors('usosMaximosAntesMantenimiento')}" class="mt-1 text-xs text-slate-400">Un número entero mayor a 0. Al llegar a esa cantidad de usos se requiere mantenimiento.</p>
                </div>
            </div>
        </section>

        <!-- ACCIONES -->
        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors"
                    th:text="${editando} ? 'Guardar cambios' : 'Crear barril'">
                Crear barril
            </button>
        </div>
    </form>
</div>

</body>
</html>
