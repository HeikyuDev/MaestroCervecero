<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#fabricante-lista-content}, 'barriles')}">
<body>

<div id="fabricante-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Barriles</h1>
            <p class="text-sm text-slate-500">Barriles y fabricantes de barril, en orden alfabético.</p>
        </div>
        <a th:href="@{/barriles/fabricantes/nuevo}"
           class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nuevo fabricante
        </a>
    </div>

    <div th:replace="~{barril/tabs :: tabs('fabricantes')}"></div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/barriles/fabricantes}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 gap-4 items-end">
        <div>
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off" placeholder="Ej: Tonelería del Sur"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="flex items-center justify-end gap-3">
            <a th:href="@{/barriles/fabricantes}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="col-acciones px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="x : ${fabricantes.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3">
                    <span class="inline-block max-w-[24rem] truncate align-bottom font-medium text-slate-900" tabindex="0" th:data-tooltip="${x.nombre}" th:text="${x.nombre}">Tonelería del Sur</span>
                </td>
                <td class="col-acciones px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                        <a th:href="@{/barriles/fabricantes/{id}/editar(id=${x.id})}" title="Editar fabricante" aria-label="Editar fabricante"
                           class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-lg"></i>
                        </a>
                        <button type="button" title="Dar de baja fabricante" aria-label="Dar de baja fabricante"
                                th:data-baja-url="@{/barriles/fabricantes/{id}/baja(id=${x.id})}"
                                th:data-baja-nombre="${x.nombre}"
                                class="p-2 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-lg"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${fabricantes.empty}">
                <td colspan="2" class="px-4 py-10 text-center text-slate-400">
                    <i class="bi bi-building text-3xl block mb-2"></i>
                    No se encontraron fabricantes de barril con los criterios indicados
                </td>
            </tr>
            </tbody>
        </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${fabricantes}, 'fabricante|fabricantes',
                ${fabricantes.hasPrevious()} ? @{/barriles/fabricantes(pagina=${fabricantes.number - 1}, nombre=${filtroNombre})} : null,
                ${fabricantes.hasNext()} ? @{/barriles/fabricantes(pagina=${fabricantes.number + 1}, nombre=${filtroNombre})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja fabricante de barril', 'Si tiene barriles activos asociados, el sistema no lo permitirá.')}"></div>
</div>

</body>
</html>
