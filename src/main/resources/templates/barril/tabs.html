<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<!--
    Pestañas del módulo de barriles: cada una es su propia URL.
    activa = 'barriles' | 'fabricantes'
-->
<nav th:fragment="tabs(activa)" class="flex flex-wrap gap-1 border-b border-slate-200" aria-label="Barriles">
    <a th:href="@{/barriles}"
       th:classappend="${activa == 'barriles'} ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-700'"
       class="px-4 py-2 -mb-px text-sm font-semibold border-b-2 transition-colors">
        <i class="bi bi-boxes mr-1.5"></i>Barriles
    </a>
    <a th:href="@{/barriles/fabricantes}"
       th:classappend="${activa == 'fabricantes'} ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-700'"
       class="px-4 py-2 -mb-px text-sm font-semibold border-b-2 transition-colors">
        <i class="bi bi-building mr-1.5"></i>Fabricantes de barril
    </a>
</nav>

</html>
