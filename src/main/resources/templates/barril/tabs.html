<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Pestañas del módulo de barriles (componente fragments/pestanas): cada una es su propia URL. activa = 'barriles' | 'fabricantes' -->
<th:block th:fragment="tabs(activa)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Barriles', 'barriles', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <a th:replace="~{fragments/pestanas :: pestana(@{/barriles}, ${activa == 'barriles'}, 'barriles', ~{fragments/pestanas :: bi('bi-boxes')}, 'Barriles')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/barriles/fabricantes}, ${activa == 'fabricantes'}, 'fabricantes', ~{fragments/pestanas :: bi('bi-building')}, 'Fabricantes de barril')}"></a>
        </th:block>
    </th:block>
</th:block>

</html>
