<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#home-content}, 'dashboard')}">
<body>

<div id="home-content" class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Panel de Control</h1>
        <p class="text-sm text-slate-500">Bienvenido al sistema de gestión de producción cervecera.</p>
    </div>

    <!-- =====================================================================
         PANEL DE CONTROL POR ROL
         Cada rol ve su propio panel (home/dashboard-*), que el HomeController carga solo para ese rol.
         Para agregar un rol nuevo:
         1. Cree el fragmento panel(dashboard) en home/dashboard-<rol>.html
         2. Copie un bloque <th:block sec:authorize="hasRole('...')"> existente y ajuste el rol y el modelo
         ===================================================================== -->
    <!-- Si el panel no se pudo armar, el controller no lo carga y avisa con la alerta del layout: el resto de la pantalla se muestra igual -->
    <th:block sec:authorize="hasRole('OPERARIO_DE_PRODUCCION')">
        <th:block th:if="${dashboardOperario != null}">
            <th:block th:replace="~{home/dashboard-operario :: panel(${dashboardOperario})}"></th:block>
        </th:block>
    </th:block>

    <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
        <th:block th:if="${dashboardGerente != null}">
            <th:block th:replace="~{home/dashboard-gerente :: panel(${dashboardGerente})}"></th:block>
        </th:block>
    </th:block>

    <th:block sec:authorize="hasRole('ENCARGADO_DE_DEPOSITO')">
        <th:block th:if="${dashboardEncargadoDeposito != null}">
            <th:block th:replace="~{home/dashboard-encargado-deposito :: panel(${dashboardEncargadoDeposito})}"></th:block>
        </th:block>
    </th:block>

    <th:block sec:authorize="hasRole('ADMINISTRADOR')">
        <th:block th:if="${dashboardAdministrador != null}">
            <th:block th:replace="~{home/dashboard-administrador :: panel(${dashboardAdministrador})}"></th:block>
        </th:block>
    </th:block>

    <th:block sec:authorize="hasRole('GERENTE_DE_COMPRAS')">
        <th:block th:if="${dashboardGerenteCompras != null}">
            <th:block th:replace="~{home/dashboard-gerente-compras :: panel(${dashboardGerenteCompras})}"></th:block>
        </th:block>
    </th:block>

    <th:block sec:authorize="hasRole('ENCARGADO_DE_DISTRIBUCION')">
        <th:block th:if="${dashboardEncargadoDistribucion != null}">
            <th:block th:replace="~{home/dashboard-encargado-distribucion :: panel(${dashboardEncargadoDistribucion})}"></th:block>
        </th:block>
    </th:block>
</div>

</body>
</html>
