<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Fila de la tabla de ítems del formulario de la orden de compra.

    La fila lleva sus datos en campos ocultos con el nombre indexado que espera el OrdenCompraFormDTO
    (detallesCompra[0].idCatalogoProveedor, detallesCompra[0].cantidad y detallesCompra[0].costoUnitario). La misma fila
    se usa para pintar lo que ya tiene la orden (alta con errores) y como plantilla (<template>) que clona
    /js/orden-compra-form.js al agregar un ítem desde la modal:

      data-campo   campo oculto del DTO; /js/orden-compra-form.js recalcula el índice del nombre.
      data-celda   texto visible; /js/orden-compra-form.js escribe ahí el dato elegido en el modal y el subtotal.

    Parámetros: indice (posición en la lista), el id del ítem del catálogo, la cantidad y el costo unitario, el nombre del
    insumo, el de la presentación comercial y su medida ya escrita ("25 kg"; null si el ítem ya no existe en el catálogo
    vigente del proveedor) y conError (true si el servidor rechazó algún campo de la fila: se resalta; la plantilla pasa false).
-->

<tr th:fragment="item(indice, idCatalogoProveedor, cantidad, costoUnitario, insumo, presentacion, medida, conError)"
    data-fila data-prefijo="detallesCompra" th:classappend="${conError} ? 'bg-rose-50'">
    <td class="px-3 py-3">
        <input type="hidden" data-campo="idCatalogoProveedor" th:name="|detallesCompra[${indice}].idCatalogoProveedor|" th:value="${idCatalogoProveedor}">
        <input type="hidden" data-campo="cantidad" th:name="|detallesCompra[${indice}].cantidad|" th:value="${cantidad}">
        <input type="hidden" data-campo="costoUnitario" th:name="|detallesCompra[${indice}].costoUnitario|" th:value="${costoUnitario?.toPlainString()}">
        <span class="block break-words font-medium text-slate-900" data-celda="insumo" th:text="${insumo != null} ? ${insumo} : 'Ítem no disponible'">Pilsen</span>
    </td>
    <td class="px-3 py-3">
        <span class="block break-words text-slate-700" data-celda="presentacion" th:text="${presentacion}">Bolsa de 25 Kg</span>
        <span class="block text-xs text-slate-500 whitespace-nowrap" data-celda="medida" th:text="${medida}">25 kg</span>
    </td>
    <td class="px-3 py-3 text-right text-slate-700 whitespace-nowrap" data-celda="cantidad" th:text="${cantidad}">10</td>
    <td class="px-3 py-3 text-right text-slate-700 whitespace-nowrap" data-celda="costoUnitario"
        th:text="${costoUnitario != null} ? ${T(com.github.heikyudev.maestrocervecero.util.FormatoImporte).conSimbolo(costoUnitario)}">1.250,50</td>
    <td class="px-3 py-3 text-right font-medium text-slate-900 whitespace-nowrap" data-celda="subtotal"
        th:text="${cantidad != null and costoUnitario != null} ? ${T(com.github.heikyudev.maestrocervecero.util.FormatoImporte).conSimbolo(costoUnitario * cantidad)}">12.505,00</td>
    <td class="col-acciones px-3 py-3 text-right">
        <button type="button" data-quitar-fila
                class="inline-flex items-center gap-1 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
            <i class="bi bi-trash"></i> Quitar
        </button>
    </td>
</tr>

</html>
