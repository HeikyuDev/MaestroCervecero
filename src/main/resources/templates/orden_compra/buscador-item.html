<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de ítems de una orden de compra: criterios de filtro + resultados con "Elegir". Solo
    ofrece los ítems del catálogo del proveedor elegido cuyo insumo usa la receta de la planificación elegida, y deja
    afuera los que la orden ya tiene. La planificación, el proveedor y los ítems ya agregados viajan en campos ocultos
    del formulario de búsqueda y en los enlaces de paginación, porque el modal conserva el contexto de la orden.

    El botón "Elegir" lleva en data-insumo, data-presentacion y data-medida los textos que la fila de la orden muestra;
    data-medida ya viene escrita con el formato de receta/formato :: medida (un fragmento no se puede escribir dentro de
    un atributo): /js/orden-compra-form.js la copia tal cual a la fila.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar ítem</h3>
            <p class="text-sm text-slate-500">Ítems del proveedor cuyo insumo usa la receta de la planificación.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{/ordenes-compra/buscador/items}" method="get" data-modal-buscar
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <input type="hidden" name="idProveedor" th:value="${idProveedor}">
        <input type="hidden" name="idPlanificacion" th:value="${idPlanificacion}">
        <input type="hidden" name="idsAgregados" th:value="${idsAgregados}">
        <div>
            <label for="buscador-insumo" class="block text-xs font-medium text-slate-500 mb-1">Insumo</label>
            <input type="text" id="buscador-insumo" name="insumo" th:value="${filtroInsumo}" autofocus autocomplete="off" placeholder="Ej: Pilsen"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-presentacion" class="block text-xs font-medium text-slate-500 mb-1">Presentación comercial</label>
            <input type="text" id="buscador-presentacion" name="presentacion" th:value="${filtroPresentacion}" autocomplete="off" placeholder="Ej: Bolsa de 25 Kg"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="sm:col-span-2 flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3 whitespace-nowrap">Insumo</th>
                <th class="px-4 py-3 whitespace-nowrap">Presentación comercial</th>
                <th class="px-4 py-3 whitespace-nowrap">Medida</th>
                <th class="px-4 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="i : ${items.content}" th:with="pc=${i.presentacionComercial}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${i.insumo.nombre}">Pilsen</td>
                <td class="px-4 py-3 text-slate-700" th:text="${i.presentacionComercial.nombre}">Bolsa de 25 Kg</td>
                <td class="px-4 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${i.presentacionComercial.cantidad}, ${i.presentacionComercial.unidadDeMedida?.simbolo})}"></th:block></td>
                <td class="px-4 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${i.id}" th:data-texto="${i.insumo.nombre + ' - ' + i.presentacionComercial.nombre}"
                            th:data-insumo="${i.insumo.nombre}" th:data-presentacion="${i.presentacionComercial.nombre}"
                            th:data-medida="${(pc.cantidad == null or pc.unidadDeMedida == null) ? '' : ((pc.cantidad == pc.cantidad.intValue() ? #numbers.formatInteger(pc.cantidad.intValue(), 1, 'POINT') : #strings.replace(pc.cantidad, '.', ',')) + ' ' + pc.unidadDeMedida.simbolo)}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${items.empty}">
                <td colspan="4" class="px-4 py-8 text-center text-slate-400">No se encontraron ítems del proveedor que use la receta de la planificación con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${items}, 'ítem|ítems',
                ${items.hasPrevious()} ? @{/ordenes-compra/buscador/items(pagina=${items.number - 1}, idProveedor=${idProveedor}, idPlanificacion=${idPlanificacion}, idsAgregados=${idsAgregados}, insumo=${filtroInsumo}, presentacion=${filtroPresentacion})} : null,
                ${items.hasNext()} ? @{/ordenes-compra/buscador/items(pagina=${items.number + 1}, idProveedor=${idProveedor}, idPlanificacion=${idPlanificacion}, idsAgregados=${idsAgregados}, insumo=${filtroInsumo}, presentacion=${filtroPresentacion})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
