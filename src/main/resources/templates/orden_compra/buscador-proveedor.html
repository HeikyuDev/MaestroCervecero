<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de proveedores de una orden de compra: criterios de filtro + resultados con
    "Elegir". Lo usan el formulario de alta y el filtro del listado. Solo ofrece proveedores activos, y la razón
    social no es única: por eso la tabla muestra también el CUIT y el texto elegido lo incluye.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar proveedor</h3>
            <p class="text-sm text-slate-500">Filtre y elija el proveedor.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{/ordenes-compra/buscador/proveedores}" method="get" data-modal-buscar
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div>
            <label for="buscador-razon-social" class="block text-xs font-medium text-slate-500 mb-1">Razón social</label>
            <input type="text" id="buscador-razon-social" name="razonSocial" th:value="${filtroRazonSocial}" autofocus autocomplete="off" placeholder="Ej: Malterías del Sur S.A."
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-cuit" class="block text-xs font-medium text-slate-500 mb-1">CUIT</label>
            <input type="text" id="buscador-cuit" name="cuit" th:value="${filtroCuit}" autocomplete="off" placeholder="Ej: 30-71234567-8"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="sm:col-span-2 flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3 whitespace-nowrap">Razón social</th>
                <th class="px-4 py-3 whitespace-nowrap">CUIT</th>
                <th class="px-4 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="p : ${proveedores.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${p.version.razonSocial}">Malterías del Sur S.A.</td>
                <td class="px-4 py-3 text-slate-700 whitespace-nowrap" th:text="${T(com.github.heikyudev.maestrocervecero.util.validacion.ValidacionesTexto).formatearCuit(p.version.cuit)}">30-71234567-8</td>
                <td class="px-4 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${p.id}"
                            th:data-texto="${textosPorId.get(p.id)}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${proveedores.empty}">
                <td colspan="3" class="px-4 py-8 text-center text-slate-400">No se encontraron proveedores con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${proveedores}, 'proveedor|proveedores',
                ${proveedores.hasPrevious()} ? @{/ordenes-compra/buscador/proveedores(pagina=${proveedores.number - 1}, razonSocial=${filtroRazonSocial}, cuit=${filtroCuit})} : null,
                ${proveedores.hasNext()} ? @{/ordenes-compra/buscador/proveedores(pagina=${proveedores.number + 1}, razonSocial=${filtroRazonSocial}, cuit=${filtroCuit})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
