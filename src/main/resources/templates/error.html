<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#error-content}, null)}">
<body>

<!-- Página de error genérico: misma estructura que el resto del sistema, sin detalles técnicos -->
<div id="error-content" class="max-w-xl mx-auto mt-16 text-center space-y-4">
    <i class="bi bi-exclamation-circle block text-5xl text-amber-500"></i>
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">No se pudo completar la operación</h1>
    <p class="text-sm text-slate-500">Vuelva al inicio e intente nuevamente.</p>
    <div class="flex items-center justify-center gap-3 pt-2">
        <a th:href="@{/home}"
           class="inline-flex items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-house"></i> Ir al inicio
        </a>
    </div>
</div>

</body>
</html>
