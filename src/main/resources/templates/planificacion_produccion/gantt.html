<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Diagrama de Gantt de una planificación: HTML y CSS propios, sin librerías. No hace ninguna cuenta: dibuja
    la geometría que ya calculó GanttPlanificacionBuilder (posiciones y anchos en % del eje de tiempo).

    Un carril por fermentador, con su identificador en una columna fija a la izquierda; el área de tiempo
    se desplaza horizontalmente cuando es más ancha que la pantalla. Las barras llevan el texto truncado y
    el detalle del lote en el tooltip (title).

    Capas: la grilla y las marcas de hoy y de la planificación se dibujan antes que los carriles, o sea detrás
    de las barras, para no cruzar su texto; "hoy" también lleva una bandera sobre el eje. Las etiquetas de
    fecha de los bordes se alinean hacia adentro (alineación calculada por el builder).

    Tres colores (la misma paleta en las barras y en la leyenda): azul para lo planificado (los pendientes y lo
    que falta de un lote en ejecución), naranja sólido para lo ya transcurrido de un lote en ejecución y verde para
    los finalizados. Los lotes cancelados no se dibujan. El lote en ejecución atrasado extiende su barra hasta hoy,
    toda en naranja, con la etiqueta "Atrasado N días"; los pendientes que su atraso corre se dibujan en azul en su
    posición corrida, sin marca propia. Entre dos lotes vivos de un fermentador se dibuja un bloque gris de un día
    para su limpieza.

    Lo usan el estado actual de una planificación y el cronograma global (cronograma/cronograma). El global
    puede traer carriles sin barras (se muestran con un aviso), barras atenuadas (lotes de otra planificación
    que la destacada) y no tiene marcas de inicio y fin de planificación.

    Uso: <div th:replace="~{planificacion_produccion/gantt :: gantt(${gantt})}"></div>
-->
<div th:fragment="gantt(vista)">

    <style>
        .gantt-color--pendiente { background: #2563eb; color: #ffffff; }
        .gantt-color--en-ejecucion { background: #2563eb; color: #ffffff; }
        .gantt-color--finalizado { background: #047857; color: #ffffff; }
        .gantt-color--limpieza { background: #cbd5e1; box-shadow: inset 0 0 0 1px #94a3b8; }
        .gantt-barra { position: absolute; top: 0.5rem; bottom: 0.5rem; display: flex; align-items: center; overflow: hidden; border-radius: 0.375rem; }
        .gantt-barra--atenuada { opacity: 0.3; }
        .gantt-limpieza { position: absolute; top: 0.5rem; bottom: 0.5rem; border-radius: 0.375rem; }
        .gantt-limpieza--atenuada { opacity: 0.3; }
        .gantt-progreso { position: absolute; top: 0; bottom: 0; left: 0; background: #f97316; }
        .gantt-etiqueta-atraso { position: relative; flex-shrink: 0; margin-left: auto; margin-right: 0.25rem; padding: 0 0.375rem; border-radius: 0.25rem; background: #ffffff; color: #c2410c; font-size: 10px; font-weight: 600; line-height: 16px; white-space: nowrap; }
        /* Etiquetas del eje: ancladas a su marca; las de los bordes quedan hacia adentro para no recortarse */
        .gantt-marca { top: 70%; }
        .gantt-marca--izquierda { transform: translate(0.25rem, -50%); }
        .gantt-marca--centro { transform: translate(-50%, -50%); }
        .gantt-marca--derecha { transform: translate(calc(-100% - 0.25rem), -50%); }
        /* Bandera "Hoy" sobre el eje, con la punta hacia el día */
        .gantt-hoy-bandera { position: absolute; top: 2px; padding: 0 6px; border-radius: 4px; background: #f43f5e; color: #ffffff; font-size: 10px; font-weight: 600; line-height: 14px; white-space: nowrap; }
        .gantt-hoy-bandera::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -4px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid #f43f5e; }
        .gantt-hoy-bandera--centro { transform: translateX(-50%); }
        .gantt-hoy-bandera--izquierda { transform: translateX(-1px); }
        .gantt-hoy-bandera--izquierda::after { left: 0; margin-left: 1px; }
        .gantt-hoy-bandera--derecha { transform: translateX(calc(-100% + 1px)); }
        .gantt-hoy-bandera--derecha::after { left: auto; right: 0; margin-left: 0; margin-right: 1px; }
        .gantt-muestra { display: inline-block; width: 1.5rem; height: 0.75rem; border-radius: 0.25rem; }
    </style>

    <!-- Leyenda -->
    <ul class="mb-3 flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-600" aria-label="Leyenda del diagrama">
        <li class="inline-flex items-center gap-2"><span class="gantt-muestra gantt-color--pendiente"></span> Planificado</li>
        <li class="inline-flex items-center gap-2"><span class="gantt-muestra" style="background: linear-gradient(90deg, #f97316 50%, #2563eb 50%)"></span> En ejecución</li>
        <li class="inline-flex items-center gap-2"><span class="gantt-muestra gantt-color--finalizado"></span> Finalizado</li>
        <li class="inline-flex items-center gap-2"><span class="gantt-muestra gantt-color--limpieza"></span> Limpieza</li>
        <li class="inline-flex items-center gap-2"><span class="inline-block h-3 border-l-2 border-rose-500"></span> Hoy</li>
        <li th:if="${vista.inicioPlanificacionPct != null or vista.finPlanificacionPct != null}" class="inline-flex items-center gap-2"><span class="inline-block h-3 border-l-2 border-dashed border-slate-500"></span> Inicio y fin estimados de la planificación</li>
        <li th:if="${vista.planificacionResaltada}" class="inline-flex items-center gap-2"><span class="gantt-muestra gantt-color--pendiente opacity-30"></span> Lote de otra planificación (atenuado)</li>
    </ul>

    <div class="overflow-x-auto rounded-lg border border-slate-200" data-gantt>
        <div class="flex" th:style="|min-width: ${vista.anchoMinimoPx + 144}px|">

            <!-- Columna fija de fermentadores -->
            <div class="sticky left-0 z-20 w-36 shrink-0 border-r border-slate-200 bg-white">
                <div class="h-10 border-b border-slate-200 bg-slate-50 px-3 flex items-center text-xs font-semibold text-slate-500 uppercase tracking-wider">Fermentador</div>
                <div th:each="c : ${vista.carriles}" th:text="${c.etiqueta}" th:title="${c.etiqueta}"
                     class="h-12 border-b border-slate-100 px-3 flex items-center truncate text-sm font-medium text-slate-800">F-01</div>
            </div>

            <!-- Área de tiempo -->
            <div class="relative min-w-0 flex-1">

                <!-- Líneas de la grilla y marcas de hoy y de la planificación: van detrás de las barras
                     (los carriles se dibujan después), así que nunca cruzan el texto de una barra -->
                <div class="pointer-events-none absolute inset-0" aria-hidden="true">
                    <span th:each="m : ${vista.marcasEje}" th:style="|left: ${m.posicionPct}%|"
                          class="absolute top-10 bottom-0 border-l border-slate-100"></span>
                    <span th:if="${vista.inicioPlanificacionPct != null}" th:style="|left: ${vista.inicioPlanificacionPct}%|"
                          title="Inicio estimado de la planificación"
                          class="absolute top-10 bottom-0 border-l-2 border-dashed border-slate-500"></span>
                    <span th:if="${vista.finPlanificacionPct != null}" th:style="|left: ${vista.finPlanificacionPct}%|"
                          title="Fin estimado de la planificación"
                          class="absolute top-10 bottom-0 border-l-2 border-dashed border-slate-500"></span>
                    <span th:if="${vista.hoyPct != null}" th:style="|left: ${vista.hoyPct}%|" data-gantt-hoy
                          title="Hoy"
                          class="absolute top-10 bottom-0 border-l-2 border-rose-500"></span>
                </div>

                <!-- Eje de fechas -->
                <div class="relative h-10 border-b border-slate-200 bg-slate-50">
                    <span th:each="m : ${vista.marcasEje}" th:text="${m.etiqueta}" th:style="|left: ${m.posicionPct}%|"
                          th:classappend="|gantt-marca--${m.alineacion.clave()}|"
                          class="gantt-marca absolute whitespace-nowrap text-xs text-slate-500">01/07</span>
                    <!-- Bandera "Hoy": marca el día sobre el eje, con su pie de línea hasta la grilla -->
                    <span th:if="${vista.hoyPct != null}" th:style="|left: ${vista.hoyPct}%|"
                          class="absolute bottom-0 h-5 border-l-2 border-rose-500" aria-hidden="true"></span>
                    <span th:if="${vista.hoyPct != null}" th:style="|left: ${vista.hoyPct}%|"
                          th:classappend="|gantt-hoy-bandera--${vista.hoyAlineacion.clave()}|"
                          class="gantt-hoy-bandera" data-gantt-hoy-bandera>Hoy</span>
                </div>

                <!-- Carriles con sus barras -->
                <div th:each="c : ${vista.carriles}" class="relative h-12 border-b border-slate-100">
                    <span th:if="${#lists.isEmpty(c.barras)}" data-gantt-carril-vacio
                          class="absolute inset-0 flex items-center px-3 text-xs italic text-slate-400">Sin lotes en este período</span>
                    <!-- Limpieza del fermentador: un día libre entre dos lotes vivos, solo hoy o más adelante -->
                    <div th:each="l : ${c.limpiezas}" data-gantt-limpieza
                         th:title="${l.tooltip}" th:attr="aria-label=${l.tooltip}" role="img"
                         th:style="|left: ${l.izquierdaPct}%; width: ${l.anchoPct}%|"
                         th:classappend="${l.atenuada} ? 'gantt-limpieza--atenuada'"
                         class="gantt-limpieza gantt-color--limpieza"></div>
                    <div th:each="b : ${c.barras}" role="img" tabindex="0"
                         th:title="${b.tooltip}" th:attr="aria-label=${b.tooltip}"
                         th:style="|left: ${b.izquierdaPct}%; width: ${b.anchoPct}%|"
                         th:classappend="|gantt-color--${b.estadoClave} gantt-barra--${b.estadoClave}${b.atenuada ? ' gantt-barra--atenuada' : ''}|"
                         class="gantt-barra focus:outline-none focus:ring-2 focus:ring-slate-800">
                        <div th:if="${b.progresoPct > 0}" th:style="|width: ${b.progresoPct}%|" class="gantt-progreso"></div>
                        <span th:text="${b.etiqueta}" class="relative min-w-0 truncate px-2 text-xs font-medium">PILSEN-1 - Pendiente</span>
                        <span th:if="${b.etiquetaAtraso != null}" th:text="${b.etiquetaAtraso}"
                              data-gantt-atraso-etiqueta class="gantt-etiqueta-atraso">Atrasado 3 días</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
