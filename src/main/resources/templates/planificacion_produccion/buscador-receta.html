<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de recetas: criterio de nombre + resultados con "Elegir". Lo comparten el buscador
    del formulario de alta de planificaciones y los buscadores de los filtros de consulta (listado de planificaciones,
    listado de lotes y cronograma de producción). El controller indica la URL del buscador (urlBuscadorRecetas) y si
    ofrece la casilla "Incluir dados de baja" (ofreceIncluirDadosDeBaja), que solo tienen los filtros de consulta: suma
    las recetas dadas de baja que tienen planificaciones, para filtrar el historial.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar receta</h3>
            <p class="text-sm text-slate-500">Filtre y elija la receta.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{${urlBuscadorRecetas}}" method="get" data-modal-buscar novalidate
          class="p-6 grid grid-cols-1 gap-4 items-end">
        <div>
            <label for="buscador-nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="buscador-nombre" name="nombre" th:value="${filtroNombre}" autofocus autocomplete="off" placeholder="Ej: Pale Ale"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div th:if="${ofreceIncluirDadosDeBaja}">
            <label for="buscador-incluir-dados-de-baja" class="inline-flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" id="buscador-incluir-dados-de-baja" name="incluirDadosDeBaja" value="true" th:checked="${filtroIncluirDadosDeBaja}"
                       class="rounded border-slate-300 text-amber-500 focus:ring-amber-500/40">
                Incluir dados de baja
            </label>
            <p class="text-xs text-slate-400">Suma las recetas dadas de baja que tuvieron planificaciones.</p>
        </div>
        <div class="flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Volumen base (L)</th>
                <th class="px-4 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="r : ${recetas.content}" th:with="dadaDeBaja=${r.estado != null and r.estado.name() == 'BAJA'}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900">
                    <span th:text="${r.version.nombre}">Pale Ale</span>
                    <span th:if="${dadaDeBaja}" data-receta-dada-de-baja
                          class="ml-1 inline-block whitespace-nowrap rounded bg-slate-200 px-1.5 text-[10px] font-semibold leading-4 text-slate-600">Dada de baja</span>
                </td>
                <td class="px-4 py-3 text-slate-700"><th:block th:replace="~{receta/formato :: numero(${r.version.volumenBase})}"></th:block></td>
                <td class="px-4 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${r.id}"
                            th:data-texto="${dadaDeBaja} ? |${r.version.nombre} (dada de baja)| : ${r.version.nombre}"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${recetas.empty}">
                <td colspan="3" class="px-4 py-8 text-center text-slate-400">No se encontraron recetas con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${recetas}, 'receta|recetas',
                ${recetas.hasPrevious()} ? @{${urlBuscadorRecetas}(pagina=${recetas.number - 1}, nombre=${filtroNombre}, incluirDadosDeBaja=${filtroIncluirDadosDeBaja ? true : null})} : null,
                ${recetas.hasNext()} ? @{${urlBuscadorRecetas}(pagina=${recetas.number + 1}, nombre=${filtroNombre}, incluirDadosDeBaja=${filtroIncluirDadosDeBaja ? true : null})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
