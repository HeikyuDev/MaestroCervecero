<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#usuario-form-content}, 'usuarios')}">
<body>

<!-- editando = true cuando se modifica un usuario existente (llega usuarioId), false en el alta -->
<div id="usuario-form-content" class="space-y-6" th:with="editando=${usuarioId != null}">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="@{/usuarios}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a usuarios
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight"
            th:text="${editando} ? 'Editar usuario' : 'Nuevo usuario'">Nuevo usuario</h1>
        <p class="text-sm text-slate-500">Completá los datos de la persona y su acceso al sistema.
            Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form th:action="${editando} ? @{/usuarios/{id}(id=${usuarioId})} : @{/usuarios}"
          th:object="${usuarioForm}" method="post" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <!-- Resumen de todos los errores: campos inválidos (@Valid) y reglas de negocio del service -->
        <div th:replace="~{fragments/form-errors :: resumen(${editando} ? 'No se pudo modificar el usuario' : 'No se pudo crear el usuario')}"></div>

        <!-- DATOS PERSONALES -->
        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Datos personales</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                <div>
                    <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre/s <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="text" id="nombre" th:field="*{nombre}" autofocus autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="apellido" class="block text-sm font-medium text-slate-700 mb-1">Apellido/s <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="text" id="apellido" th:field="*{apellido}" autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('apellido')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-slate-700 mb-1">Teléfono <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="tel" id="telefono" th:field="*{telefono}" autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('telefono')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div class="xl:col-span-2">
                    <label for="correo" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="email" id="correo" th:field="*{correo}" autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('correo')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" class="mt-1 text-xs text-rose-600"></p>
                </div>

            </div>
        </section>

        <!-- ACCESO AL SISTEMA -->
        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Acceso al sistema</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Nombre de usuario <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="text" id="username" th:field="*{username}" autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('username')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña <span th:unless="${editando}" class="text-rose-600" title="Obligatorio">*</span></label>
                    <!-- th:field no se usa a propósito: nunca se re-muestra una contraseña al volver a renderizar -->
                    <input type="password" id="password" name="password" th:required="${!editando}" autocomplete="new-password"
                           th:placeholder="${editando} ? 'Dejala vacía para conservar la actual' : null"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-rose-600"></p>
                    <p th:unless="${#fields.hasErrors('password')}" th:text="${reglasPassword}" class="mt-1 text-xs text-slate-400"></p>
                </div>

                <!-- Rol: en la cuenta propia se muestra fijo (no se puede cambiar el propio rol) -->
                <div th:if="${esCuentaPropia}">
                    <span class="block text-sm font-medium text-slate-700 mb-1">Rol <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <input type="hidden" th:field="*{rol}">
                    <div class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-600"
                         th:text="${#strings.replace(usuarioForm.rol, '_', ' ')}">ROL</div>
                    <p class="mt-1 text-xs text-slate-400">No podés cambiar tu propio rol.</p>
                    <p th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div th:unless="${esCuentaPropia}">
                    <label for="rol" class="block text-sm font-medium text-slate-700 mb-1">Rol <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <select id="rol" th:field="*{rol}"
                            class="w-full px-3 py-2 rounded-lg border text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                            th:classappend="${#fields.hasErrors('rol')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                        <option value="">Seleccioná un rol</option>
                        <option th:each="r : ${roles}" th:value="${r}"
                                th:text="${#strings.replace(r, '_', ' ')}">ROL</option>
                    </select>
                    <p th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}" class="mt-1 text-xs text-rose-600"></p>
                </div>

            </div>
        </section>

        <!-- ACCIONES -->
        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="@{/usuarios}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors"
                    th:text="${editando} ? 'Guardar cambios' : 'Crear usuario'">
                Crear usuario
            </button>
        </div>
    </form>
</div>

</body>
</html>
