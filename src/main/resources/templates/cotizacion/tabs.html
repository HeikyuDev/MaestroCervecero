<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Pestañas del detalle de una solicitud de cotización (componente fragments/pestanas): cada una es la misma URL con
    ?pestana=<clave>.
    Parámetros: activa (la PestanaSolicitudCotizacion activa), idSolicitud y pestanas (las PestanaSolicitudCotizacion que se muestran).
-->
<th:block th:fragment="tabs(activa, idSolicitud, pestanas)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Secciones de la solicitud de cotización', 'solicitud', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <th:block th:each="p : ${pestanas}">
                <a th:replace="~{fragments/pestanas :: pestana(@{/solicitudes-cotizacion/{id}(id=${idSolicitud}, pestana=${p.clave})}, ${activa == p}, ${p.clave}, ~{fragments/pestanas :: bi(${p.icono})}, ${p.etiqueta})}"></a>
            </th:block>
        </th:block>
    </th:block>
</th:block>

</html>
