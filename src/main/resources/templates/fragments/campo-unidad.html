<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Campo numérico con la unidad como sufijo fijo pegado al input (input group), para las cantidades y los precios cuya
    unidad depende del insumo elegido. Si el prefijo empieza con "$" y todavía no hay insumo, el sufijo muestra "$" en lugar de "-". La etiqueta queda corta ("Cantidad", "Precio unitario") y la unidad se muestra
    en el sufijo una vez elegido el insumo; mientras tanto el sufijo muestra "-" y el campo sigue siendo editable. El
    servidor valida la cantidad y la unidad; el sufijo es solo informativo (se completa desde el JS al elegir el insumo:
    cualquier [data-unidad-sufijo] del formulario).

    Parámetros: id (id y name del input), valor (valor a mostrar), placeholder, unidad (símbolo del insumo elegido o null),
    prefijo (texto antes del símbolo, por ejemplo '/ ', o '' ), error (true si el campo tiene error) y autofocus (true si es el primer campo editable).
-->
<div th:fragment="numero(id, valor, placeholder, unidad, prefijo, error, autofocus)" data-grupo-unidad class="flex">
    <input type="number" th:id="${id}" th:name="${id}" step="any" th:autofocus="${autofocus}" autocomplete="off" th:placeholder="${placeholder}" th:value="${valor}"
           class="min-w-0 flex-1 px-3 py-2 rounded-l-lg border border-r-0 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
           th:classappend="${error} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
    <span data-unidad-sufijo th:data-prefijo="${prefijo}" th:data-vacio="${#strings.startsWith(prefijo, '$')} ? '$' : '-'"
          class="inline-flex min-w-[3.5rem] shrink-0 items-center justify-center whitespace-nowrap px-3 rounded-r-lg border bg-slate-100 text-sm font-medium text-slate-500"
          th:classappend="${error} ? 'border-rose-400' : 'border-slate-300'"
          th:text="${unidad != null and !#strings.isEmpty(unidad)} ? ${prefijo + unidad} : (${#strings.startsWith(prefijo, '$')} ? '$' : '-')">-</span>
</div>

<!--
    Campo numérico ligado al formulario (th:field) con una unidad fija como sufijo ("L", "kg/h", "%", "$", "IBU", "min"),
    para las medidas cuya unidad no depende de otro dato. La etiqueta no repite la unidad. El sufijo no lleva
    data-unidad-sufijo para que los scripts de cantidades por insumo no lo reemplacen.

    Parámetros: campo (nombre de la propiedad del formulario), id (id del input; null usa el nombre del campo),
    placeholder, unidad, error (true si el campo tiene error), min, step y autofocus (true para el primer campo editable).
-->
<div th:fragment="fijo(campo, id, placeholder, unidad, error, min, step, autofocus)" class="flex">
    <input type="number" th:id="${id}" th:field="*{__${campo}__}" th:attr="min=${min},step=${step}" th:autofocus="${autofocus}" autocomplete="off" th:placeholder="${placeholder}"
           class="min-w-0 flex-1 px-3 py-2 rounded-l-lg border border-r-0 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
           th:classappend="${error} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
    <span class="inline-flex min-w-[3.5rem] shrink-0 items-center justify-center whitespace-nowrap px-3 rounded-r-lg border bg-slate-100 text-sm font-medium text-slate-500"
          th:classappend="${error} ? 'border-rose-400' : 'border-slate-300'"
          th:text="${unidad}"></span>
</div>

<!--
    Igual que fijo, para el campo que no se liga con th:field (valor y nombre propios, por ejemplo un valor sin ceros
    decimales o un campo anidado de un diálogo). Parámetros: nombre (name del input), id, valor, placeholder, unidad,
    error, min, max, step y autofocus.
-->
<div th:fragment="medida(nombre, id, valor, placeholder, unidad, error, min, max, step, autofocus)" class="flex">
    <input type="number" th:id="${id}" th:name="${nombre}" th:value="${valor}" th:attr="min=${min},max=${max},step=${step}" th:autofocus="${autofocus}" autocomplete="off" th:placeholder="${placeholder}"
           class="min-w-0 flex-1 px-3 py-2 rounded-l-lg border border-r-0 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
           th:classappend="${error} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
    <span class="inline-flex min-w-[3.5rem] shrink-0 items-center justify-center whitespace-nowrap px-3 rounded-r-lg border bg-slate-100 text-sm font-medium text-slate-500"
          th:classappend="${error} ? 'border-rose-400' : 'border-slate-300'"
          th:text="${unidad}"></span>
</div>

<!--
    Campo numérico de un diálogo (sin formulario ligado) con la unidad fija como sufijo. El script del diálogo lo lee
    con data-campo-modal. Parámetros: id, campoModal, placeholder, unidad, min y step.
-->
<div th:fragment="dialogo(id, campoModal, placeholder, unidad, min, step)" class="flex">
    <input type="number" th:id="${id}" th:attr="data-campo-modal=${campoModal},min=${min},step=${step}" autocomplete="off" th:placeholder="${placeholder}"
           class="min-w-0 flex-1 px-3 py-2 rounded-l-lg border border-r-0 border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
    <span class="inline-flex min-w-[3.5rem] shrink-0 items-center justify-center whitespace-nowrap px-3 rounded-r-lg border border-slate-300 bg-slate-100 text-sm font-medium text-slate-500"
          th:text="${unidad}"></span>
</div>

</html>
