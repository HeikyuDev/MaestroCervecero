<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Visor de la descripción de una fila, compartido por las listas. La descripción no se muestra en la
    tabla (un texto muy largo la desarmaría): cada fila que la tiene muestra el botón "boton" y /js/modales.js
    abre el diálogo "dialogo" con el nombre como título y el texto completo.

    El texto viaja en atributos data-* escapados por Thymeleaf, nunca concatenado en JavaScript.
    El diálogo se cierra con el botón, con Esc o con un clic en el fondo.

    Uso en cada fila:   <th:block th:replace="~{fragments/dialogo-descripcion :: boton(${x.nombre}, ${x.descripcion})}"></th:block>
    Una vez por página: <div th:replace="~{fragments/dialogo-descripcion :: dialogo}"></div>
-->

<!-- Botón "Ver descripción": solo se renderiza cuando la fila tiene descripción -->
<button th:fragment="boton(nombre, descripcion)" type="button"
        th:if="${descripcion != null and !#strings.isEmpty(#strings.trim(descripcion))}"
        title="Ver descripción" aria-label="Ver descripción"
        th:data-descripcion-titulo="${nombre}"
        th:data-descripcion-texto="${descripcion}"
        class="p-2 rounded-lg text-slate-500 hover:bg-sky-50 hover:text-sky-600 transition-colors">
    <i class="bi bi-info-circle text-lg"></i>
</button>

<dialog th:fragment="dialogo" id="dialogo-descripcion"
        class="m-auto w-full max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
    <div class="p-6">
        <div class="flex items-start gap-3">
            <span class="p-2 rounded-full bg-sky-50 text-sky-600"><i class="bi bi-info-circle-fill text-xl"></i></span>
            <div class="min-w-0">
                <h3 data-descripcion-titulo-destino class="text-lg font-semibold text-slate-900 break-words"></h3>
                <p data-descripcion-texto-destino class="mt-1 max-h-72 overflow-y-auto text-sm text-slate-600 whitespace-pre-wrap break-words"></p>
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <button type="button" data-cerrar-descripcion
                    class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cerrar</button>
        </div>
    </div>
</dialog>

</html>
