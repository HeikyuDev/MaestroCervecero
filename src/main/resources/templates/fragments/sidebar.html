<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<!--
    Botón de navegación de la sidebar. Se resalta cuando su clave coincide con la opción activa de la página.
    Parámetros: url, opcionActiva (la de la página), clave (la de este botón), icono (Bootstrap Icons) y texto.
-->
<a th:fragment="enlace(url, opcionActiva, clave, icono, texto)" th:href="@{${url}}"
   th:classappend="${opcionActiva == clave} ? 'bg-amber-500/10 text-amber-500 border-amber-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border-transparent'"
   class="flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-4 font-medium text-sm transition-all">
    <i class="bi text-lg" th:classappend="${icono}"></i>
    <span th:text="${texto}">Opción</span>
</a>

<!--
    Botón de navegación de una pantalla que todavía no existe: se muestra atenuado, sin enlace (no navega a una página
    inexistente) y con la leyenda "Próximamente". Cuando exista el controller, se reemplaza por el fragmento "enlace".
    Parámetros: icono (Bootstrap Icons) y texto.
-->
<span th:fragment="enlaceProximamente(icono, texto)" title="Próximamente" aria-disabled="true"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-4 border-transparent font-medium text-sm text-slate-600 cursor-not-allowed">
    <i class="bi text-lg" th:classappend="${icono}"></i>
    <span th:text="${texto}">Opción</span>
    <span class="ml-auto text-xs font-normal text-slate-500">Próximamente</span>
</span>

<!--
    Título de una sección de la sidebar.
-->
<p th:fragment="seccion(titulo)" th:text="${titulo}"
   class="px-3 pt-5 pb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">Sección</p>

<!--
    La barra se desplaza con la rueda del mouse. Su scrollbar ocupa SIEMPRE el mismo ancho (6px) y tiene un color
    casi igual al del fondo, así que no se nota; se ilumina solo cuando el mouse está sobre la propia barra. Si el
    ancho cambiara al pasar el mouse por la sidebar, el contenido se reacomodaría (los textos largos pasarían a dos
    renglones). El scrollbar nativo, grueso, claro y con flechas, desentona sobre el fondo oscuro. Chrome, Edge y
    Safari usan las reglas ::-webkit-scrollbar; el resto de los navegadores (Firefox) usan scrollbar-width. No se
    mezclan las dos formas porque, si se fija scrollbar-width, Chrome ignora las reglas ::-webkit-scrollbar.
-->
<aside th:fragment="sidebar(opcionActiva)"
    class="sidebar-scroll w-64 bg-slate-900 border-r border-slate-800 text-slate-300 flex flex-col justify-between select-none overflow-y-auto">
    <style>
        @supports selector(::-webkit-scrollbar) {
            .sidebar-scroll::-webkit-scrollbar { width: 6px; }
            .sidebar-scroll::-webkit-scrollbar-button { display: none; }
            .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
            .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.14); border-radius: 9999px; }
            .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
        }
        @supports not selector(::-webkit-scrollbar) {
            .sidebar-scroll { scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.2) transparent; }
        }
    </style>

    <nav class="p-4 space-y-1">

        <!-- DASHBOARD (Todos los usuarios autenticados) -->
        <a th:replace="~{fragments/sidebar ::enlace('/home', ${opcionActiva}, 'dashboard', 'bi-speedometer2', 'Panel de Control')}"></a>

        <!--
            OPERACIÓN: el trabajo diario. Cada botón lo ve solo el rol que lo usa, y el título de la
            sección aparece únicamente si el usuario ve al menos uno de sus botones.
        -->
        <th:block sec:authorize="hasAnyRole('OPERARIO_DE_PRODUCCION', 'GERENTE_DE_PRODUCCION', 'GERENTE_DE_COMPRAS', 'ENCARGADO_DE_DEPOSITO')">
            <p th:replace="~{fragments/sidebar ::seccion('Operación')}"></p>

            <!-- CRONOGRAMA DE PRODUCCIÓN (Gerente de Producción: lo gestiona; Operario de Producción: lo consulta) -->
            <th:block sec:authorize="hasAuthority('LOTE_CONSULTAR')">
                <a th:replace="~{fragments/sidebar ::enlace('/cronograma-produccion', ${opcionActiva}, 'cronograma', 'bi-bar-chart-steps', 'Cronograma de Producción')}"></a>
            </th:block>

            <!-- GESTIÓN DE LOTES (Operario de Producción, Gerente de Producción: quien puede consultar lotes) -->
            <th:block sec:authorize="hasAuthority('LOTE_CONSULTAR')">
                <a th:replace="~{fragments/sidebar ::enlace('/lotes', ${opcionActiva}, 'lotes', 'bi-collection', 'Gestión de Lotes')}"></a>
            </th:block>

            <!-- PLANIFICACIÓN DE PRODUCCIÓN (Gerente de Producción: gestiona; Gerente de Compras: consulta) -->
            <th:block sec:authorize="hasAnyRole('GERENTE_DE_PRODUCCION', 'GERENTE_DE_COMPRAS')">
                <a th:replace="~{fragments/sidebar ::enlace('/planificaciones-produccion', ${opcionActiva}, 'planificaciones', 'bi-calendar3', 'Planificación de Producción')}"></a>
            </th:block>

            <!-- ÓRDENES DE COMPRA (Gerente de Compras: las gestiona; Encargado de Depósito: las consulta) -->
            <th:block sec:authorize="hasAnyRole('GERENTE_DE_COMPRAS', 'ENCARGADO_DE_DEPOSITO')">
                <a th:replace="~{fragments/sidebar ::enlace('/ordenes-compra', ${opcionActiva}, 'ordenes-compra', 'bi-cart3', 'Órdenes de Compra')}"></a>
            </th:block>

            <!-- INGRESOS DE INSUMO (Encargado de Depósito: quien puede consultar ingresos) -->
            <th:block sec:authorize="hasAuthority('INGRESO_INSUMO_CONSULTAR')">
                <a th:replace="~{fragments/sidebar ::enlace('/ingresos-insumo', ${opcionActiva}, 'ingresos-insumo', 'bi-box-arrow-in-down', 'Ingresos de Insumo')}"></a>
            </th:block>
        </th:block>

        <!--
            ADMINISTRACIÓN: los datos que se definen una vez (insumos, equipamiento, recetas, presentaciones comerciales,
            proveedores, ubicaciones, usuarios) y alimentan al resto del sistema. Va debajo de la operación diaria.
        -->
        <th:block sec:authorize="hasAnyRole('GERENTE_DE_PRODUCCION', 'GERENTE_DE_COMPRAS', 'ADMINISTRADOR')">
            <p th:replace="~{fragments/sidebar ::seccion('Administración')}"></p>

            <!-- GESTIÓN DE INSUMOS: maltas, lúpulos y levaduras en pestañas (Gerente de Producción) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
                <a th:replace="~{fragments/sidebar ::enlace('/insumos/maltas', ${opcionActiva}, 'insumos', 'bi-box-seam', 'Gestión de Insumos')}"></a>
            </th:block>

            <!-- GESTIÓN DE RECETAS (Gerente de Producción) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
                <a th:replace="~{fragments/sidebar ::enlace('/recetas', ${opcionActiva}, 'recetas', 'bi-journal-bookmark', 'Gestión de Recetas')}"></a>
            </th:block>

            <!-- GESTIÓN DE BARRILES: barriles y fabricantes de barril en pestañas (Gerente de Producción) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
                <a th:replace="~{fragments/sidebar ::enlace('/barriles', ${opcionActiva}, 'barriles', 'bi-boxes', 'Gestión de Barriles')}"></a>
            </th:block>

            <!-- GESTIÓN DE EQUIPAMIENTO: molinos, maceradores, ollas de hervor y fermentadores en pestañas (Gerente de Producción) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
                <a th:replace="~{fragments/sidebar ::enlace('/equipamiento/molinos', ${opcionActiva}, 'equipamiento', 'bi-tools', 'Gestión de Equipamiento')}"></a>
            </th:block>

            <!-- GESTIÓN DE PRESENTACIONES: presentaciones comerciales de los insumos (Gerente de Compras) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_COMPRAS')">
                <a th:replace="~{fragments/sidebar ::enlace('/presentaciones-comerciales', ${opcionActiva}, 'presentaciones-comerciales', 'bi-box', 'Gestión de Presentaciones')}"></a>
            </th:block>

            <!-- GESTIÓN DE PROVEEDORES: proveedores y su catálogo de insumos (Gerente de Compras) -->
            <th:block sec:authorize="hasRole('GERENTE_DE_COMPRAS')">
                <a th:replace="~{fragments/sidebar ::enlace('/proveedores', ${opcionActiva}, 'proveedores', 'bi-truck', 'Gestión de Proveedores')}"></a>
            </th:block>

            <!-- GESTIÓN DE UBICACIONES: países, provincias y localidades en pestañas (Administrador) -->
            <th:block sec:authorize="hasRole('ADMINISTRADOR')">
                <a th:replace="~{fragments/sidebar ::enlace('/ubicaciones/paises', ${opcionActiva}, 'ubicaciones', 'bi-globe', 'Gestión de Ubicaciones')}"></a>
                <a th:replace="~{fragments/sidebar ::enlace('/usuarios', ${opcionActiva}, 'usuarios', 'bi-people', 'Gestión de Usuarios')}"></a>
            </th:block>
        </th:block>

        <!-- CONFIGURACIÓN: parámetros del sistema que ajusta el Gerente de Producción -->
        <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
            <p th:replace="~{fragments/sidebar ::seccion('Configuración')}"></p>
            <a th:replace="~{fragments/sidebar ::enlace('/configuracion-produccion', ${opcionActiva}, 'configuracion-produccion', 'bi-sliders', 'Configuración de Producción')}"></a>
        </th:block>

        <!-- SISTEMA: control del propio sistema (Administrador) -->
        <th:block sec:authorize="hasRole('ADMINISTRADOR')">
            <p th:replace="~{fragments/sidebar ::seccion('Sistema')}"></p>
            <a th:replace="~{fragments/sidebar ::enlace('/auditoria', ${opcionActiva}, 'auditoria', 'bi-shield-check', 'Bitácora de Auditoría')}"></a>
        </th:block>
    </nav>

    <!-- Footer del Sidebar -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
        Versión 1.0 &copy; 2026
    </div>
</aside>

</html>
