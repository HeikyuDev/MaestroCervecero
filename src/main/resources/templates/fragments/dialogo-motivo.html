<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Diálogo pequeño que pide un motivo antes de confirmar una acción (anular, finalizar). Mismo mecanismo
    que fragments/dialogo-baja: lo abre /js/modales.js desde un botón con data-motivo-dialogo (el id de este
    diálogo), data-motivo-url (a dónde se envía) y data-motivo-nombre (de qué es la acción).

    El formulario envía el campo "motivo". Es obligatorio, pero lo valida el servidor: si falta, vuelve a la
    página con el mensaje en la alerta. th:action es necesario aunque /js/modales.js lo reemplace por la URL de
    cada fila: es lo que hace que Spring Security agregue el token CSRF al formulario.

    Parámetros: id (del diálogo), titulo, resumen (frase que sigue al nombre; ej. 'Se registrará el motivo...'),
    etiquetaConfirmar (texto del botón), claseBoton (colores Tailwind del botón de confirmar), icono (Bootstrap Icons),
    ejemploMotivo (texto de ejemplo del campo motivo, sin el prefijo 'Ej: ').

    Uso: <div th:replace="~{fragments/dialogo-motivo :: dialogo('dialogo-anular', 'Anular planificación', '...',
         'Anular', 'bg-rose-600 hover:bg-rose-700', 'bi-x-circle', 'Se canceló el pedido del cliente')}"></div>
-->
<dialog th:fragment="dialogo(id, titulo, resumen, etiquetaConfirmar, claseBoton, icono, ejemploMotivo)" th:id="${id}" data-dialogo-motivo
        class="m-auto w-full max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
    <form method="post" th:action="@{/}" novalidate class="p-6">
        <div class="flex items-start gap-3">
            <span class="p-2 rounded-full bg-amber-50 text-amber-600"><i class="bi text-xl" th:classappend="${icono}"></i></span>
            <div class="min-w-0 flex-1">
                <h3 class="text-lg font-semibold text-slate-900" th:text="${titulo}">Título</h3>
                <p class="mt-1 text-sm text-slate-600">
                    <strong data-dialogo-nombre-destino class="text-slate-900"></strong>
                    <span th:text="${resumen}"></span>
                </p>
                <label th:for="${id} + '-motivo'" class="mt-4 block text-sm font-medium text-slate-700 mb-1">Motivo <span class="text-rose-600" title="Obligatorio">*</span></label>
                <textarea th:id="${id} + '-motivo'" name="motivo" rows="3" autocomplete="off" th:placeholder="'Ej: ' + ${ejemploMotivo}"
                          class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"></textarea>
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button type="button" data-cerrar-dialogo
                    class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cancelar</button>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold text-white shadow-sm transition-colors"
                    th:classappend="${claseBoton}" th:text="${etiquetaConfirmar}">Confirmar</button>
        </div>
    </form>
</dialog>

</html>
