<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!--
    Piezas comunes de las pantallas públicas (inicio de sesión y restablecimiento de la contraseña), que no usan el
    layout de la aplicación porque se muestran sin sesión.

    Uso:
      <head th:replace="~{fragments/pantalla-publica :: cabecera('Iniciar sesión')}"></head>
      <div th:replace="~{fragments/pantalla-publica :: marca}"></div>
      <div th:replace="~{fragments/pantalla-publica :: alerta}"></div>
      <p th:replace="~{fragments/pantalla-publica :: pie}"></p>
      <button th:replace="~{fragments/pantalla-publica :: alternarContrasena('password')}"></button>

    El botón del ojo va dentro de un contenedor "relative" junto al campo de contraseña (con padding derecho para no
    taparle el texto) y necesita el script /js/mostrar-contrasena.js en la pantalla.
-->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ningún pedido a otro sitio informa la dirección de la pantalla: puede llevar el token de un enlace -->
    <meta name="referrer" content="no-referrer">
    <title th:text="${titulo} + ' - Maestro Cervecero'">Maestro Cervecero</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/logo-32x32.ico}" />

    <!-- Tailwind CSS local (se reconstruye con frontend/tailwind) -->
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">

    <style>
        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-2%, -2%); }
            30% { transform: translate(1%, -3%); }
            50% { transform: translate(-1%, 2%); }
            70% { transform: translate(3%, 1%); }
            90% { transform: translate(2%, -1%); }
        }
        .bg-grain::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            animation: grain 8s steps(10) infinite;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

<!-- Header con Identidad Visual -->
<div th:fragment="marca" class="text-center mb-8">
    <img th:src="@{/img/logo-256x256.png}" alt="Logo Maestro Cervecero"
         class="w-24 h-24 mx-auto mb-4 drop-shadow-lg" />
    <h1 class="text-2xl font-extrabold tracking-tight text-white">
        MAESTRO<span class="text-amber-500">CERVECERO</span>
    </h1>
    <p class="text-sm text-slate-400 mt-1.5">Gestión Integral de Producción</p>
</div>

<!-- Alerta: mensaje dinámico (atributos mensaje y tipo) -->
<div th:fragment="alerta" th:if="${mensaje != null}"
     th:class="'p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6 border ' +
                (${tipo == 'danger'} ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' :
                (${tipo == 'success'} ? 'bg-teal-500/10 border-teal-500/30 text-teal-400' :
                (${tipo == 'warning'} ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' :
                'bg-blue-500/10 border-blue-500/30 text-blue-400')))"
     role="alert">
    <i th:class="'bi text-lg flex-shrink-0 ' +
                  (${tipo == 'danger'} ? 'bi-x-circle-fill' :
                  (${tipo == 'success'} ? 'bi-check-circle-fill' :
                  (${tipo == 'warning'} ? 'bi-exclamation-triangle-fill' :
                  'bi-info-circle-fill')))"></i>
    <span th:text="${mensaje}">Mensaje del sistema</span>
</div>

<!-- Botón del ojo que muestra u oculta el texto del campo de contraseña indicado -->
<button th:fragment="alternarContrasena(idCampo)" type="button"
        class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-amber-400 focus:outline-none focus-visible:text-amber-400"
        th:attr="data-alternar-contrasena=${idCampo},aria-controls=${idCampo}"
        aria-label="Mostrar contraseña" aria-pressed="false">
    <i class="bi bi-eye" aria-hidden="true"></i>
</button>

<p th:fragment="pie" class="text-center text-xs text-slate-500 mt-8">
    &copy; 2026 Maestro Cervecero. Todos los derechos reservados.
</p>

</body>
</html>
