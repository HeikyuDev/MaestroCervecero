<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<header th:fragment="header"
    class="h-16 bg-slate-900 border-b border-slate-800 text-slate-100 flex items-center justify-between px-6 z-30 relative">

    <!-- Logo / Marca -->
    <a th:href="@{/home}" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
        <img th:src="@{/img/logo-128x128.png}" alt="Logo Maestro Cervecero" class="w-9 h-9 object-contain" />
        <span class="font-extrabold text-lg tracking-wider text-slate-100">
            MAESTRO<span class="text-amber-500">CERVECERO</span>
        </span>
    </a>

    <!-- Acciones y Perfil de Usuario -->
    <div class="flex items-center gap-5" sec:authorize="isAuthenticated()">

        <!-- Botón de Notificaciones -->
        <button type="button" class="relative p-2 text-slate-400 hover:text-amber-500 transition-colors"
            aria-label="Notificaciones">
            <i class="bi bi-bell text-lg"></i>
        </button>

        <div class="h-6 w-px bg-slate-800"></div>

        <!-- Info de Usuario -->
        <div class="text-right text-xs select-none">
            <p class="font-semibold text-slate-200" sec:authentication="name">Usuario</p>
            <p class="text-amber-500 font-medium" th:each="auth : ${#authentication.principal.authorities}"
                th:if="${#strings.startsWith(auth.authority, 'ROLE_')}"
                th:text="${#strings.replace(#strings.replace(auth.authority, 'ROLE_', ''), '_', ' ')}">
                [ROL]
            </p>
        </div>

        <div class="h-6 w-px bg-slate-800"></div>

        <!-- Botón directo de Logout -->
        <form th:action="@{/logout}" method="post">
            <button type="submit"
                class="group flex items-center justify-center w-9 h-9 rounded-lg text-slate-400 hover:bg-rose-500/10 hover:text-rose-400 transition-all"
                aria-label="Cerrar Sesión" title="Cerrar Sesión">
                <i class="bi bi-box-arrow-right text-lg transition-transform group-hover:translate-x-0.5"></i>
            </button>
        </form>
    </div>
</header>

</html>
