<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Botón estándar para pasar de la fila de un listado a la pantalla de trabajo o de detalle de ese registro. Texto fijo
    "Abrir" con flecha a la derecha, mismo aspecto en todas las listas, pensado para la celda fija col-acciones.

    Parámetros: url (destino ya resuelto, por ejemplo @{/lotes/{id}(id=${l.id})}) y etiquetaAccesible (texto corto para
    lectores de pantalla que identifica la fila, por ejemplo 'Abrir LOT-R1-02'). No lleva tooltip.

    Uso: <th:block th:replace="~{fragments/boton-abrir :: abrir(@{/lotes/{id}(id=${l.id})}, 'Abrir ' + ${l.identificadorInterno})}"></th:block>
-->
<a th:fragment="abrir(url, etiquetaAccesible)" data-boton-abrir th:href="${url}" th:aria-label="${etiquetaAccesible}"
   class="inline-flex items-center gap-1 whitespace-nowrap px-3 py-1.5 rounded-lg border border-amber-300 bg-amber-50 text-xs font-semibold text-amber-700 shadow-sm hover:bg-amber-500 hover:text-white hover:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
    Abrir <i class="bi bi-arrow-right" aria-hidden="true"></i>
</a>

</html>
