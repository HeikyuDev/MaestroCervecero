<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Botón que abre el detalle de una anulación o cancelación (motivo, usuario y fecha y hora) en un diálogo. Es el único
    modo de mostrar un motivo de anulación o cancelación: nunca va dentro de la fila ni en línea en la página. El diálogo
    (fragments/dialogo-detalle-anulacion) está en el layout y lo abre /js/modales.js.

    Parámetros: cancelacion (true para una cancelación, false para una anulación), motivo, usuario y fecha (LocalDateTime).
    Si el registro no tiene motivo, no se muestra el botón.

    Uso: <th:block th:replace="~{fragments/detalle-anulacion :: boton(false, ${c.motivoAnulacion}, ${c.usuarioAnulacion}, ${c.fechaAnulacion})}"></th:block>
-->
<button th:fragment="boton(cancelacion, motivo, usuario, fecha)" type="button" th:if="${motivo != null}" data-detalle-anulacion
        th:data-detalle-titulo="${cancelacion} ? 'Detalle de la cancelación' : 'Detalle de la anulación'"
        th:data-detalle-etiqueta-usuario="${cancelacion} ? 'Cancelado por' : 'Anulado por'"
        th:data-detalle-motivo="${motivo}" th:data-detalle-usuario="${usuario}"
        th:data-detalle-fecha="${fecha != null} ? ${#temporals.format(fecha, 'dd/MM/yyyy HH:mm')}"
        th:aria-label="${cancelacion} ? 'Ver detalle de la cancelación' : 'Ver detalle de la anulación'"
        th:title="${cancelacion} ? 'Ver detalle de la cancelación' : 'Ver detalle de la anulación'"
        class="inline-flex shrink-0 items-center rounded p-1 text-slate-400 hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
</button>

<!--
    Botón que abre el detalle de la finalización de una orden de compra (motivo, usuario y fecha y hora) en el mismo diálogo.
    Se muestra siempre, también cuando la finalización fue automática (sin motivo): el título pasa a "Finalizada automáticamente".

    Parámetros: motivo (puede ser null), usuario y fecha (LocalDateTime).

    Uso: <th:block th:replace="~{fragments/detalle-anulacion :: finalizacion(${orden.motivoFinalizacion}, ${orden.usuarioFinalizacion}, ${orden.fechaFinalizacion})}"></th:block>
-->
<button th:fragment="finalizacion(motivo, usuario, fecha)" type="button" data-detalle-anulacion data-detalle-finalizacion
        data-detalle-etiqueta-usuario="Finalizada por"
        th:data-detalle-titulo="${motivo != null} ? 'Detalle de la finalización' : 'Finalizada automáticamente'"
        th:data-detalle-motivo="${motivo}" th:data-detalle-usuario="${usuario}"
        th:data-detalle-fecha="${fecha != null} ? ${#temporals.format(fecha, 'dd/MM/yyyy HH:mm')}"
        aria-label="Ver detalle de la finalización" title="Ver detalle de la finalización"
        class="inline-flex shrink-0 items-center rounded p-1 text-slate-400 hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
</button>

<!--
    Igual que "boton" pero sin el usuario: el diálogo muestra solo el motivo y la fecha y hora. Lo usa el control de equipamiento,
    que no muestra personas.

    Parámetros: cancelacion (true para una cancelación, false para una anulación), motivo y fecha (LocalDateTime).
-->
<button th:fragment="botonSinUsuario(cancelacion, motivo, fecha)" type="button" th:if="${motivo != null}" data-detalle-anulacion data-detalle-sin-usuario
        th:data-detalle-titulo="${cancelacion} ? 'Detalle de la cancelación' : 'Detalle de la anulación'"
        th:data-detalle-motivo="${motivo}"
        th:data-detalle-fecha="${fecha != null} ? ${#temporals.format(fecha, 'dd/MM/yyyy HH:mm')}"
        th:aria-label="${cancelacion} ? 'Ver detalle de la cancelación' : 'Ver detalle de la anulación'"
        th:title="${cancelacion} ? 'Ver detalle de la cancelación' : 'Ver detalle de la anulación'"
        class="inline-flex shrink-0 items-center rounded p-1 text-slate-400 hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
</button>

<!--
    Botón que abre las observaciones de una operación (un texto que puede ser largo) en el mismo diálogo pequeño que el detalle
    de una anulación: el texto nunca va dentro de la fila de una tabla. Mismo botón, mismas clases y mismo ícono; el diálogo
    muestra el título, el texto bajo la etiqueta "Observaciones" y la fecha y hora de la operación. Si no hay texto, no se muestra
    el botón.

    Parámetros: titulo (por ejemplo 'Observaciones de la limpieza'), texto (las observaciones) y fecha (LocalDateTime de la operación).

    Uso: <th:block th:replace="~{fragments/detalle-anulacion :: observaciones('Observaciones de la falla', ${o.observaciones}, ${o.fecha})}"></th:block>
-->
<button th:fragment="observaciones(titulo, texto, fecha)" type="button" th:if="${texto != null and !#strings.isEmpty(texto)}" data-detalle-anulacion data-detalle-sin-usuario
        th:data-detalle-titulo="${titulo}" data-detalle-etiqueta-motivo="Observaciones" data-detalle-etiqueta-fecha="Fecha y hora de la operación"
        th:data-detalle-motivo="${texto}"
        th:data-detalle-fecha="${fecha != null} ? ${#temporals.format(fecha, 'dd/MM/yyyy HH:mm')}"
        aria-label="Ver observaciones" title="Ver observaciones"
        class="inline-flex shrink-0 items-center rounded p-1 text-slate-400 hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
</button>

</html>
