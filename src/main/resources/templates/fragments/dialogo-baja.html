<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Diálogo de confirmación de baja, compartido por todas las listas. Lo abre /js/modales.js desde
    un botón con data-baja-url (a dónde se envía la baja) y data-baja-nombre (qué se da de baja).

    th:action es necesario aunque /js/modales.js lo reemplace por la URL de cada fila: es lo que hace
    que Spring Security agregue el token CSRF al formulario, sin el cual la baja se rechaza.

    Uso: <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja país', 'Si tiene provincias activas, el sistema no lo permitirá.')}"></div>
-->
<dialog th:fragment="dialogo(titulo, consecuencia)" id="dialogo-baja"
        class="m-auto w-full max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
    <form method="post" th:action="@{/}" class="p-6">
        <div class="flex items-start gap-3">
            <span class="p-2 rounded-full bg-rose-50 text-rose-600"><i class="bi bi-exclamation-triangle-fill text-xl"></i></span>
            <div>
                <h3 class="text-lg font-semibold text-slate-900" th:text="${titulo}">Dar de baja</h3>
                <p class="mt-1 text-sm text-slate-600">
                    ¿Confirmás la baja de <strong data-baja-nombre-destino class="text-slate-900"></strong>?
                    <span th:text="${consecuencia}"></span>
                </p>
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button type="button" data-cerrar-dialogo
                    class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cancelar</button>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 shadow-sm transition-colors">Dar de baja</button>
        </div>
    </form>
</dialog>

</html>
