<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Campos del lote de un ingreso de insumo, comunes al formulario por compra y al directo. Se insertan DENTRO del
    <form th:object="${ingresoForm}">.

    El lote no se crea aparte: lo crea el primer ingreso que usa su identificación. "Ver lotes existentes" abre un modal con
    los lotes ya registrados del insumo (también los agotados y los vencidos); elegir uno completa la identificación y el
    vencimiento y deja el vencimiento de solo lectura, con "Limpiar" para escribir un lote nuevo. El botón queda
    deshabilitado hasta que se conoce el insumo (comportamiento de /js/ingreso-insumo-form.js).

    Parámetros: urlBuscadorLotes (URL del modal de lotes) e idInsumoElegido (el insumo ya conocido, o null).
-->
<th:block th:fragment="lote(urlBuscadorLotes, idInsumoElegido)">
    <div>
        <label for="identificacionLoteProveedor" class="block text-sm font-medium text-slate-700 mb-1">Identificación del lote del proveedor <span class="text-rose-600" title="Obligatorio">*</span></label>
        <input type="text" id="identificacionLoteProveedor" name="identificacionLoteProveedor" autocomplete="off" placeholder="Ej: L-125"
               th:value="*{identificacionLoteProveedor}"
               class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
               th:classappend="${#fields.hasErrors('identificacionLoteProveedor')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
        <p th:if="${#fields.hasErrors('identificacionLoteProveedor')}" th:errors="*{identificacionLoteProveedor}" class="mt-1 text-xs text-rose-600"></p>
        <p class="mt-1 text-xs text-slate-500">Se guarda en mayúsculas y sin espacios de más.</p>
        <div data-lote-existente data-selector th:data-buscador-url="${idInsumoElegido != null} ? ${urlBuscadorLotes + '?idInsumo=' + idInsumoElegido} : ${urlBuscadorLotes}"
             th:data-buscador-base="${urlBuscadorLotes}" th:data-deshabilitado="${idInsumoElegido == null} ? 'true'"
             th:classappend="${idInsumoElegido == null} ? 'opacity-50'" class="mt-2 inline-block">
            <input type="hidden" data-selector-id>
            <input type="hidden" data-selector-texto>
            <span role="button" tabindex="0" data-selector-buscar th:attr="aria-disabled=${idInsumoElegido == null}"
                  class="inline-flex cursor-pointer select-none items-center gap-2 whitespace-nowrap px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-700 hover:border-amber-400 hover:text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors">
                <i class="bi bi-list-ul"></i> Ver lotes existentes
            </span>
        </div>
        <p data-ayuda-lote th:hidden="${idInsumoElegido != null}" class="mt-1 text-xs text-slate-500">Elija primero el insumo.</p>
    </div>

    <div>
        <label for="fechaVencimiento" class="block text-sm font-medium text-slate-700 mb-1">Fecha de vencimiento <span class="text-rose-600" title="Obligatorio">*</span></label>
        <input type="date" id="fechaVencimiento" name="fechaVencimiento" autocomplete="off" placeholder="Ej: 15/07/2027"
               th:value="*{fechaVencimiento}"
               class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
               th:classappend="${#fields.hasErrors('fechaVencimiento')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
        <p th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}" class="mt-1 text-xs text-rose-600"></p>
        <p data-lote-bloqueado hidden class="mt-1 text-xs text-slate-500">
            Vencimiento tomado del lote existente.
            <button type="button" data-lote-limpiar class="font-semibold text-amber-700 hover:underline focus:outline-none focus:ring-2 focus:ring-amber-500/40 rounded">Limpiar</button>
        </p>
    </div>
</th:block>

</html>
