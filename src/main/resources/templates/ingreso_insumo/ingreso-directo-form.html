<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#ingreso-directo-form-content}, 'ingresos-insumo')}">
<body>

<!--
    Formulario del ingreso directo (sin orden de compra: stock inicial, donación, etc.). Es una página aparte: al registrar
    vuelve a la pestaña "Directos" y un formulario inválido (o una regla del service) vuelve acá con sus errores y lo que
    se había cargado. El insumo se elige con el buscador en modal; al elegirlo se muestra su unidad en la cantidad y se
    habilita "Ver lotes existentes" (comportamiento de /js/ingreso-insumo-form.js, solo de visualización).
-->
<div id="ingreso-directo-form-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a ingresos
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight">Nuevo ingreso directo</h1>
        <p class="mt-1 text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form id="ingreso-form" th:action="@{${urlAccion}}" th:object="${ingresoForm}" method="post" novalidate data-un-solo-envio data-formulario-ingreso
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <div th:replace="~{fragments/form-errors :: resumen('No se pudo registrar el ingreso')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Insumo recibido</h2>

            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Insumo <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idInsumo', ${insumoElegido != null} ? ${insumoElegido.id} : *{idInsumo}, ${insumoElegido != null} ? ${insumoElegido.nombre} : null,
                            ${urlBuscadorInsumos}, null, null, false, ${#fields.hasErrors('idInsumo')}, 'Seleccione insumo')}"></div>
                    <p th:if="${#fields.hasErrors('idInsumo')}" th:errors="*{idInsumo}" class="mt-1 text-xs text-rose-600"></p>
                    <p data-insumo-elegido th:hidden="${insumoElegido == null}" class="mt-2 text-xs text-slate-500">
                        Tipo: <span data-insumo-tipo th:text="${tipoInsumoElegido}">Malta</span>
                    </p>
                </div>
            </div>
        </section>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Datos de la recepción</h2>

            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div th:replace="~{ingreso_insumo/ingreso-campos :: lote(${urlBuscadorLotes}, ${insumoElegido != null} ? ${insumoElegido.id} : null)}"></div>

                <div>
                    <label for="fechaIngreso" class="block text-sm font-medium text-slate-700 mb-1">Fecha de ingreso <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="date" id="fechaIngreso" name="fechaIngreso" autocomplete="off" placeholder="Ej: 15/07/2027"
                           th:value="*{fechaIngreso}"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('fechaIngreso')}" th:errors="*{fechaIngreso}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="cantidadRecibida" class="block text-sm font-medium text-slate-700 mb-1">Cantidad recibida (<span data-unidad th:text="${insumoElegido != null} ? ${insumoElegido.unidadDeMedida.simbolo} : 'g, kg o t, según el insumo'">g, kg o t, según el insumo</span>) <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="number" id="cantidadRecibida" name="cantidadRecibida" step="any" autocomplete="off" placeholder="Ej: 25"
                           th:value="${ingresoForm.cantidadRecibida != null and ingresoForm.cantidadRecibida == ingresoForm.cantidadRecibida.longValue()} ? ${ingresoForm.cantidadRecibida.longValue()} : *{cantidadRecibida}"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('cantidadRecibida')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('cantidadRecibida')}" th:errors="*{cantidadRecibida}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="costoUnitario" class="block text-sm font-medium text-slate-700 mb-1">Costo unitario ($ por <span data-unidad th:text="${insumoElegido != null} ? ${insumoElegido.unidadDeMedida.simbolo} : 'unidad del insumo'">unidad del insumo</span>) <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="number" id="costoUnitario" name="costoUnitario" step="any" autocomplete="off" placeholder="Ej: 12.50"
                           th:value="*{costoUnitario}"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('costoUnitario')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('costoUnitario')}" th:errors="*{costoUnitario}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
        </section>

        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">Registrar ingreso</button>
        </div>
    </form>

    <script th:src="@{/js/ingreso-insumo-form.js}" defer></script>
</div>

</body>
</html>
