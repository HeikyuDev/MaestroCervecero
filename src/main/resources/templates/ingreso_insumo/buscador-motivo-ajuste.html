<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de motivos de ajuste del formulario de un ajuste de insumo: criterios de nombre y
    tipo + resultados con "Elegir". Solo ofrece los motivos activos. El botón "Elegir" lleva en data-tipo el tipo del motivo
    (Ingreso o Egreso), que el formulario muestra debajo del motivo elegido, y en data-tipo-ajuste el valor del tipo
    (INGRESO o EGRESO).
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar motivo de ajuste</h3>
            <p class="text-sm text-slate-500">Filtre y elija el motivo.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div>
            <label for="buscador-nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="buscador-nombre" name="nombre" th:value="${filtroNombre}" autofocus autocomplete="off" placeholder="Ej: Merma por derrame"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-tipo" class="block text-xs font-medium text-slate-500 mb-1">Tipo</label>
            <select id="buscador-tipo" name="tipo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:selected="${t == filtroTipo}" th:text="${t.etiqueta}">Ingreso</option>
            </select>
        </div>
        <div class="sm:col-span-2 flex items-center justify-end gap-3">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <div class="contenedor-buscador">
<table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-3 whitespace-nowrap">Nombre</th>
                <th class="px-3 py-3 whitespace-nowrap">Tipo</th>
                <th class="col-acciones px-3 py-3"><span class="sr-only">Acciones</span></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="m : ${motivos.content}" class="hover:bg-slate-50">
                <td class="px-3 py-3 font-medium text-slate-900 break-words" th:text="${m.nombre}">Merma por derrame</td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="${m.tipoAjuste.etiqueta}">Egreso</td>
                <td class="col-acciones px-3 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${m.id}" th:data-texto="${m.nombre}"
                            th:data-tipo="${m.tipoAjuste.etiqueta}" th:data-tipo-ajuste="${m.tipoAjuste.name()}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${motivos.empty}">
                <td colspan="3" class="px-3 py-8 text-center text-slate-400">No se encontraron motivos de ajuste con los criterios indicados</td>
            </tr>
            </tbody>
        </table>
</div>

        <div th:replace="~{fragments/paginacion :: paginacion(${motivos}, 'motivo de ajuste|motivos de ajuste',
                ${motivos.hasPrevious()} ? @{${urlBuscador}(pagina=${motivos.number - 1}, nombre=${filtroNombre}, tipo=${filtroTipo})} : null,
                ${motivos.hasNext()} ? @{${urlBuscador}(pagina=${motivos.number + 1}, nombre=${filtroNombre}, tipo=${filtroTipo})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
