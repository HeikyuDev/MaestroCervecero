<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de un lote de insumo de un ajuste: todos los lotes del insumo ya elegido (idInsumo, que
    viaja en los enlaces de paginación), también los vencidos y los agotados, por fecha de vencimiento, con "Elegir". Sin
    criterios de filtro: lo que se filtra es el insumo. Lo usan el formulario del ajuste y el filtro de la lista: en el
    filtro el insumo es el primer paso del mismo modal, el controller indica la URL de ese paso (urlInsumos) y el modal
    ofrece volver a él; en ese caso el texto del lote elegido incluye el insumo. El botón "Elegir" lleva, además del id y el
    texto, los datos que el formulario muestra del lote elegido (vencimiento, cantidad actual y unidad). Si no hay insumo
    elegido, el controller informa el motivo en mensajeBuscador y el fragmento no muestra filas.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar lote de insumo</h3>
            <p class="text-sm text-slate-500" th:unless="${mensajeBuscador != null}">
                Lotes de <strong class="text-slate-900" th:text="${nombreInsumo}">Pilsen</strong>: elija el lote.
            </p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p th:if="${mensajeBuscador != null}" data-mensaje-buscador class="p-6 text-sm text-slate-500" th:text="${mensajeBuscador}">Elija primero el insumo</p>

    <th:block th:if="${mensajeBuscador == null}">
        <div th:if="${urlInsumos != null}" class="px-6 pt-4">
            <a data-modal-get th:href="@{${urlInsumos}}"
               class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
                <i class="bi bi-arrow-left"></i> Elegir otro insumo
            </a>
        </div>

        <div class="border-t border-slate-100 mt-4">
            <div class="contenedor-buscador">
<table class="tabla-buscador">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-3 whitespace-nowrap">Lote</th>
                    <th class="px-3 py-3 whitespace-nowrap">Vence</th>
                    <th class="px-3 py-3 whitespace-nowrap">Cantidad actual</th>
                    <th class="col-acciones px-3 py-3"><span class="sr-only">Acciones</span></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="l : ${lotes.content}" class="hover:bg-slate-50">
                    <td class="px-3 py-3 font-medium text-slate-900" th:text="${l.identificacionLoteProveedor}">L-125</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap">
                        <th:block th:replace="~{planificacion_produccion/formato :: fecha(${l.fechaVencimiento})}"></th:block>
                        <span th:if="${l.vencido}" class="ml-1 text-xs font-semibold text-rose-600">Vencido</span>
                    </td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${l.cantidades.total}, ${unidad})}"></th:block></td>
                    <td class="col-acciones px-3 py-3 text-right">
                        <button type="button" data-elegir th:data-id="${l.id}"
                                th:data-texto="${urlInsumos != null} ? ${nombreInsumo + ' - ' + l.identificacionLoteProveedor} : ${l.identificacionLoteProveedor}"
                                th:data-vencimiento="${l.fechaVencimiento != null} ? ${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')} : '-'"
                                th:data-cantidad="${#cantidades.conUnidad(l.cantidades.total, unidad)}"
                                th:data-unidad="${unidad}"
                                class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                    </td>
                </tr>
                <tr th:if="${lotes.empty}">
                    <td colspan="4" class="px-3 py-8 text-center text-slate-400">El insumo no tiene lotes</td>
                </tr>
                </tbody>
            </table>
</div>

            <div th:replace="~{fragments/paginacion :: paginacion(${lotes}, 'lote de insumo|lotes de insumo',
                    ${lotes.hasPrevious()} ? @{${urlBuscador}(pagina=${lotes.number - 1}, idInsumo=${idInsumo})} : null,
                    ${lotes.hasNext()} ? @{${urlBuscador}(pagina=${lotes.number + 1}, idInsumo=${idInsumo})} : null,
                    true)}"></div>
        </div>
    </th:block>
</div>

</body>
</html>
