<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#malta-form-content}, 'insumos')}">
<body>

<!-- editando = true cuando se modifica una malta existente (llega maltaId), false en el alta -->
<div id="malta-form-content" class="space-y-6" th:with="editando=${maltaId != null}">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i>
            <span th:text="${retorno != null} ? 'Volver al formulario anterior' : 'Volver a maltas'">Volver a maltas</span>
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight"
            th:text="${editando} ? 'Editar malta' : 'Nueva malta'">Nueva malta</h1>
        <p class="text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.
            <span th:if="${retorno != null}">Al guardar vuelve al formulario que estaba completando.</span></p>
    </div>

    <form th:action="${editando} ? @{/insumos/maltas/{id}(id=${maltaId})} : @{/insumos/maltas}"
          th:object="${maltaForm}" method="post" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <input type="hidden" name="retorno" th:if="${retorno != null}" th:value="${retorno}">
        <input type="hidden" name="campo" th:if="${retorno != null and campo != null}" th:value="${campo}">

        <!-- Resumen de todos los errores: campos inválidos (@Valid) y reglas de negocio del service -->
        <div th:replace="~{fragments/form-errors :: resumen(${editando} ? 'No se pudo modificar la malta' : 'No se pudo crear la malta')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Datos de la malta</h2>
            <p class="mt-1 mb-4 text-xs text-slate-400">Unidad de medida: kilogramos (la define el sistema).</p>

            <!-- Una fila por tema: identificación y características del insumo -->
            <div class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <input type="text" id="nombre" th:field="*{nombre}" autofocus autocomplete="off" placeholder="Ej: Pilsen"
                               class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                        <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                    <div>
                        <label for="tipo" class="block text-sm font-medium text-slate-700 mb-1">Tipo <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <select id="tipo" th:field="*{tipo}"
                                class="w-full px-3 py-2 rounded-lg border text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                                th:classappend="${#fields.hasErrors('tipo')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                            <option value="">Seleccione tipo</option>
                            <option th:each="t : ${tipos}" th:value="${t}"><th:block th:replace="~{receta/formato :: tipoMalta(${t})}">Base</th:block></option>
                        </select>
                        <p th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label for="potencialExtracto" class="block text-sm font-medium text-slate-700 mb-1">Extracto potencial (%) <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <input type="number" id="potencialExtracto" th:field="*{potencialExtracto}" min="1" max="90" step="1" autocomplete="off" placeholder="Ej: 80"
                               class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                               th:classappend="${#fields.hasErrors('potencialExtracto')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                        <p th:if="${#fields.hasErrors('potencialExtracto')}" th:errors="*{potencialExtracto}" class="mt-1 text-xs text-rose-600"></p>
                        <p th:unless="${#fields.hasErrors('potencialExtracto')}" class="mt-1 text-xs text-slate-400">Un número mayor a 0 y hasta 90.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ACCIONES -->
        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors"
                    th:text="${editando} ? 'Guardar cambios' : 'Crear malta'">
                Crear malta
            </button>
        </div>
    </form>
</div>

</body>
</html>
