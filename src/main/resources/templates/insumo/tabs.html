<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Pestañas del módulo de insumos (componente fragments/pestanas): cada una es su propia URL. activa = 'maltas' | 'lupulos' | 'levaduras' -->
<th:block th:fragment="tabs(activa)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Insumos', 'insumos', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <a th:replace="~{fragments/pestanas :: pestana(@{/insumos/maltas}, ${activa == 'maltas'}, 'maltas', ~{insumo/iconos :: malta('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Maltas')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/insumos/lupulos}, ${activa == 'lupulos'}, 'lupulos', ~{insumo/iconos :: lupulo('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Lúpulos')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/insumos/levaduras}, ${activa == 'levaduras'}, 'levaduras', ~{insumo/iconos :: levadura('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Levaduras')}"></a>
        </th:block>
    </th:block>
</th:block>

</html>
