<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Íconos de los tres insumos. Bootstrap Icons no tiene cereal ni lúpulo, así que se usan los de Lucide
    (licencia ISC) como SVG propio, sin sumar librerías. Se pintan con el color del texto (currentColor).

    Parámetro: clases = clases de Tailwind para el tipo de caja, el tamaño y el espaciado. Junto a un
    texto: 'inline-block h-4 w-4 mr-1'; solo y centrado: 'block h-8 w-8 mx-auto'.
    Uso: <th:block th:replace="~{insumo/iconos :: malta('inline-block h-4 w-4 mr-1')}"></th:block>

    malta     -> trigo (cereal)
    lupulo    -> cono de lúpulo
    levadura  -> burbujas (fermentación)
-->

<svg th:fragment="malta(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <path d="M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z"/>
    <path d="M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z"/>

</svg>

<svg th:fragment="levadura(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
