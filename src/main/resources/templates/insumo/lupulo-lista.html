<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#lupulo-lista-content}, 'insumos')}">
<body>

<div id="lupulo-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Insumos</h1>
            <p class="text-sm text-slate-500">Maltas, lúpulos y levaduras que intervienen en la producción, en orden alfabético.</p>
        </div>
        <a th:href="@{/insumos/lupulos/nuevo}"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nuevo lúpulo
        </a>
    </div>

    <div th:replace="~{insumo/tabs :: tabs('lupulos')}"></div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/insumos/lupulos}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div>
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off" placeholder="Ej: Cascade"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="formato" class="block text-xs font-medium text-slate-500 mb-1">Formato</label>
            <select id="formato" name="formato"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="f : ${formatos}" th:value="${f}" th:selected="${f == filtroFormato}"><th:block th:replace="~{receta/formato :: formatoLupulo(${f})}">Pellet</th:block></option>
            </select>
        </div>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
            <a th:href="@{/insumos/lupulos}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Formato</th>
                <th class="px-4 py-3">Ácidos alfa (%)</th>
                <th class="px-4 py-3">Unidad</th>
                <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="l : ${lupulos.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900"><div class="max-w-[16rem] truncate" tabindex="0" th:data-tooltip="${l.nombre}" th:text="${l.nombre}">Cascade</div></td>
                <td class="px-4 py-3">
                    <span class="inline-block px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold"><th:block th:replace="~{receta/formato :: formatoLupulo(${l.formato})}">Pellet</th:block></span>
                </td>
                <td class="px-4 py-3 text-slate-700"><th:block th:replace="~{receta/formato :: numero(${l.aa})}"></th:block></td>
                <td class="px-4 py-3 text-slate-700" th:text="${l.unidadDeMedida.simbolo}">g</td>
                <td class="px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                        <a th:href="@{/insumos/lupulos/{id}/editar(id=${l.id})}" title="Editar lúpulo" aria-label="Editar lúpulo"
                           class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-lg"></i>
                        </a>
                        <button type="button" title="Dar de baja lúpulo" aria-label="Dar de baja lúpulo"
                                th:data-baja-url="@{/insumos/lupulos/{id}/baja(id=${l.id})}"
                                th:data-baja-nombre="${l.nombre}"
                                class="p-2 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-lg"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${lupulos.empty}">
                <td colspan="5" class="px-4 py-10 text-center text-slate-400">
                    <th:block th:replace="~{insumo/iconos :: lupulo('block h-8 w-8 mx-auto mb-2')}"></th:block>
                    No se encontraron lúpulos con los criterios indicados
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${lupulos}, 'lúpulo|lúpulos',
                ${lupulos.hasPrevious()} ? @{/insumos/lupulos(pagina=${lupulos.number - 1}, nombre=${filtroNombre}, formato=${filtroFormato})} : null,
                ${lupulos.hasNext()} ? @{/insumos/lupulos(pagina=${lupulos.number + 1}, nombre=${filtroNombre}, formato=${filtroFormato})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja lúpulo', 'Si forma parte de una receta activa, de una planificación o una orden de compra en estado Pendiente, está en el catálogo de un proveedor activo o tiene stock, el sistema no lo permitirá.')}"></div>
</div>

</body>
</html>
