<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#stock-lista-content}, 'stock-insumos')}">
<body>

<!--
    Stock de insumos: pantalla de solo lectura con los insumos activos en orden alfabético y sus cantidades de stock
    (disponible, reservada, vencida y total, en la unidad del insumo). "Abrir" lleva al detalle del insumo con sus lotes.
-->
<div id="stock-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Stock de Insumos</h1>
        <p class="text-sm text-slate-500">Cantidad disponible, reservada y vencida de cada insumo, en orden alfabético.</p>
    </div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/stock-insumos}" method="get" novalidate data-filtro-stock
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off" placeholder="Ej: Pilsen"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="tipo" class="block text-xs font-medium text-slate-500 mb-1">Tipo</label>
            <select id="tipo" name="tipo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:selected="${t == filtroTipo}"><th:block th:replace="~{stock_insumo/formato :: tipoInsumo(${t})}">Malta</th:block></option>
            </select>
        </div>
        <div>
            <label for="situacionStock" class="block text-xs font-medium text-slate-500 mb-1">Situación del stock</label>
            <select id="situacionStock" name="situacionStock"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todas</option>
                <option th:each="s : ${situaciones}" th:value="${s}" th:selected="${s == filtroSituacionStock}"><th:block th:replace="~{stock_insumo/formato :: situacionStock(${s})}">Con stock disponible</th:block></option>
            </select>
        </div>
        <div class="md:col-span-3 flex items-center justify-end gap-3">
            <a th:href="@{/stock-insumos}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3">Tipo</th>
                    <th class="px-4 py-3">Unidad</th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad libre para producción: lo que hay en los lotes vigentes menos lo reservado">Disponible</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad de los lotes vigentes que está reservada para lotes de producción">Reservada</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad que conservan los lotes vencidos, incluida la parte que estaba reservada">Vencida</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad física total: disponible, reservada y vencida">Total</span></th>
                    <th class="col-acciones px-4 py-3 text-right">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="i : ${insumos.content}" th:attr="data-insumo=${i.id}" class="hover:bg-slate-50">
                    <td class="px-4 py-3 font-medium text-slate-900"><div class="max-w-[16rem] truncate" tabindex="0" th:data-tooltip="${i.nombre}" th:text="${i.nombre}">Pilsen</div></td>
                    <td class="px-4 py-3">
                        <span class="inline-block px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold"><th:block th:replace="~{stock_insumo/formato :: tipoInsumo(${i.tipo})}">Malta</th:block></span>
                    </td>
                    <td class="px-4 py-3 text-slate-700" th:text="${i.unidadDeMedida.simbolo}">kg</td>
                    <td class="px-4 py-3 text-slate-900 text-right font-medium whitespace-nowrap" data-cantidad-disponible><th:block th:replace="~{receta/formato :: numero(${i.cantidades.disponible})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-700 text-right whitespace-nowrap" data-cantidad-reservada><th:block th:replace="~{receta/formato :: numero(${i.cantidades.reservada})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-700 text-right whitespace-nowrap" data-cantidad-vencida><th:block th:replace="~{receta/formato :: numero(${i.cantidades.vencida})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-900 text-right font-semibold whitespace-nowrap" data-cantidad-total><th:block th:replace="~{receta/formato :: numero(${i.cantidades.total})}"></th:block></td>
                    <td class="col-acciones px-4 py-3">
                        <div class="flex items-center justify-end gap-1">
                            <th:block th:replace="~{fragments/boton-abrir :: abrir(@{/stock-insumos/{id}(id=${i.id})}, 'Abrir ' + ${i.nombre})}"></th:block>
                        </div>
                    </td>
                </tr>
                <tr th:if="${insumos.empty}">
                    <td colspan="8" class="px-4 py-10 text-center text-slate-400">
                        <i class="bi bi-box-seam block text-3xl mb-2"></i>
                        No se encontraron insumos con los criterios indicados
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${insumos}, 'insumo|insumos',
                ${insumos.hasPrevious()} ? @{/stock-insumos(pagina=${insumos.number - 1}, nombre=${filtroNombre}, tipo=${filtroTipo}, situacionStock=${filtroSituacionStock})} : null,
                ${insumos.hasNext()} ? @{/stock-insumos(pagina=${insumos.number + 1}, nombre=${filtroNombre}, tipo=${filtroTipo}, situacionStock=${filtroSituacionStock})} : null,
                false)}"></div>
    </div>
</div>

</body>
</html>
