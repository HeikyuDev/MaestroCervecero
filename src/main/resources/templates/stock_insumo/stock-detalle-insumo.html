<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#stock-detalle-insumo-content}, 'stock-insumos')}">
<body>

<!--
    Detalle del stock de un insumo: pantalla de solo lectura con el resumen de sus cantidades (disponible, reservada,
    vencida y total) y todos sus lotes, también los que no tienen stock o están vencidos, por fecha de vencimiento
    ascendente (el que vence primero arriba). "Abrir" lleva al detalle del lote y "Registrar ajuste", que ve quien puede registrar ajustes de insumo, al formulario de ajuste con el lote elegido.
-->
<div id="stock-detalle-insumo-content" class="space-y-6">

    <!-- Encabezado -->
    <section data-insumo-cabecera class="space-y-4">
        <a th:href="@{/stock-insumos}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a stock de insumos
        </a>
        <div class="flex flex-wrap items-center gap-3">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Stock de <span th:text="${insumo.nombre}">Pilsen</span></h1>
            <span class="inline-block px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold"><th:block th:replace="~{stock_insumo/formato :: tipoInsumo(${insumo.tipo})}">Malta</th:block></span>
        </div>
    </section>

    <!-- 1. Resumen del insumo -->
    <section data-seccion-resumen class="bg-white border border-slate-200 rounded-xl shadow-sm">
        <h2 class="px-5 py-3 border-b border-slate-200 text-sm font-semibold text-slate-700">Resumen del insumo</h2>
        <div class="p-4 space-y-3 text-sm">
            <!-- identidad -->
            <dl class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-3">
                <div>
                    <dt class="text-xs font-medium text-slate-500">Nombre</dt>
                    <dd class="mt-1 font-medium text-slate-900 break-words" th:text="${insumo.nombre}">Pilsen</dd>
                </div>
                <div>
                    <dt class="text-xs font-medium text-slate-500">Tipo</dt>
                    <dd class="mt-1 text-slate-900"><th:block th:replace="~{stock_insumo/formato :: tipoInsumo(${insumo.tipo})}">Malta</th:block></dd>
                </div>
                <div>
                    <dt class="text-xs font-medium text-slate-500">Unidad</dt>
                    <dd class="mt-1 text-slate-900" th:text="${insumo.unidadDeMedida.simbolo}">kg</dd>
                </div>
            </dl>
            <!-- cantidades -->
            <dl th:replace="~{stock_insumo/formato :: cantidades(${insumo.cantidades}, ${insumo.unidadDeMedida.simbolo})}"></dl>
        </div>
    </section>

    <!-- 2. Lotes del insumo -->
    <section data-seccion-lotes class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <h2 class="px-5 py-3 border-b border-slate-200 text-sm font-semibold text-slate-700">Lotes del insumo</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-4 py-3">Lote del proveedor</th>
                    <th class="px-4 py-3">Vence</th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad libre para producción: lo que hay en el lote menos lo reservado">Disponible</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad del lote reservada para lotes de producción">Reservada</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad que conserva el lote si está vencido, incluida la parte que estaba reservada">Vencida</span></th>
                    <th class="px-4 py-3 text-right"><span tabindex="0" data-tooltip="Cantidad física total del lote: disponible, reservada y vencida">Total</span></th>
                    <th class="col-acciones px-4 py-3 text-right">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="l : ${lotes.content}" th:attr="data-lote-insumo=${l.id}" class="hover:bg-slate-50"
                    th:with="simbolo=${insumo.unidadDeMedida.simbolo}">
                    <td class="px-4 py-3 font-medium text-slate-900"><div class="max-w-[16rem] break-words" th:text="${l.identificacionLoteProveedor}">L-125</div></td>
                    <td class="px-4 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{planificacion_produccion/formato :: fecha(${l.fechaVencimiento})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-900 text-right font-medium whitespace-nowrap" data-cantidad-disponible><th:block th:replace="~{receta/formato :: medida(${l.cantidades.disponible}, ${simbolo})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-700 text-right whitespace-nowrap" data-cantidad-reservada><th:block th:replace="~{receta/formato :: medida(${l.cantidades.reservada}, ${simbolo})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-700 text-right whitespace-nowrap" data-cantidad-vencida><th:block th:replace="~{receta/formato :: medida(${l.cantidades.vencida}, ${simbolo})}"></th:block></td>
                    <td class="px-4 py-3 text-slate-900 text-right font-semibold whitespace-nowrap" data-cantidad-total><th:block th:replace="~{receta/formato :: medida(${l.cantidades.total}, ${simbolo})}"></th:block></td>
                    <td class="col-acciones px-4 py-3">
                        <div class="flex items-center justify-end gap-1">
                            <th:block sec:authorize="hasAuthority('AJUSTE_INSUMO_REGISTRAR')">
                                <th:block th:replace="~{fragments/boton-registrar :: registrar(@{/ajustes-insumo/nuevo(idLoteInsumo=${l.id})}, 'Registrar ajuste', 'bi-sliders2', 'Registrar ajuste del lote ' + ${l.identificacionLoteProveedor})}"></th:block>
                            </th:block>
                            <th:block th:replace="~{fragments/boton-abrir :: abrir(@{/stock-insumos/lotes/{id}(id=${l.id})}, 'Abrir lote ' + ${l.identificacionLoteProveedor})}"></th:block>
                        </div>
                    </td>
                </tr>
                <tr th:if="${lotes.empty}">
                    <td colspan="7" class="px-4 py-10 text-center text-slate-400">
                        <i class="bi bi-box-seam block text-3xl mb-2"></i>
                        El insumo todavía no tiene lotes
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${lotes}, 'lote|lotes',
                ${lotes.hasPrevious()} ? @{/stock-insumos/{id}(id=${insumo.id}, pagina=${lotes.number - 1})} : null,
                ${lotes.hasNext()} ? @{/stock-insumos/{id}(id=${insumo.id}, pagina=${lotes.number + 1})} : null,
                false)}"></div>
    </section>
</div>

</body>
</html>
