<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Pestañas del módulo de equipamiento (componente fragments/pestanas): cada una es su propia URL. activa = 'molinos' | 'maceradores' | 'ollas-hervor' | 'fermentadores' -->
<th:block th:fragment="tabs(activa)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Equipamiento', 'equipamiento', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <a th:replace="~{fragments/pestanas :: pestana(@{/equipamiento/molinos}, ${activa == 'molinos'}, 'molinos', ~{equipamiento/iconos :: molino('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Molinos')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/equipamiento/maceradores}, ${activa == 'maceradores'}, 'maceradores', ~{equipamiento/iconos :: macerador('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Maceradores')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/equipamiento/ollas-hervor}, ${activa == 'ollas-hervor'}, 'ollas-hervor', ~{equipamiento/iconos :: olla('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Ollas de hervor')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/equipamiento/fermentadores}, ${activa == 'fermentadores'}, 'fermentadores', ~{equipamiento/iconos :: fermentador('inline-block h-4 w-4 mr-1.5 align-[-2px]')}, 'Fermentadores')}"></a>
        </th:block>
    </th:block>
</th:block>

</html>
