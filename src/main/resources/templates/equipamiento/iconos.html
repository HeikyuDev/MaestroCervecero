<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Íconos de los cuatro tipos de equipamiento. Bootstrap Icons no tiene equivalentes que los
    representen, así que se usan SVG propios de Lucide (licencia ISC) y Tabler (licencia MIT), sin
    sumar librerías.
    Se pintan con el color del texto (currentColor).

    Parámetro: clases = clases de Tailwind para el tipo de caja, el tamaño y el espaciado. Junto a un
    texto: 'inline-block h-4 w-4 mr-1'; solo y centrado: 'block h-8 w-8 mx-auto'.
    Uso: <th:block th:replace="~{equipamiento/iconos :: molino('inline-block h-4 w-4 mr-1')}"></th:block>

    molino       -> licuadora (Lucide blender; ninguna librería trae un molino de granos)
    macerador    -> balde con gota (Tabler bucket-droplet; maceración con agua)
    olla         -> olla (hervido)
    fermentador  -> tanque cilíndrico
-->

<svg th:fragment="molino(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 14a2 2 0 0 0-1.963 1.615l-1.018 5.193A1 1 0 0 0 6 22h12a1 1 0 0 0 .981-1.192l-1.018-5.193A2 2 0 0 0 16 14z"/>
    <path d="m17 2-1 12"/>
    <path d="M8.006 14 7 2"/>
    <path d="M7.565 8.787A5 5 0 0 0 12 8a5 5 0 0 1 4.56-.75"/>
    <path d="M19 2H5a2 2 0 0 0-2 2v5a2 2 0 0 0 .688 1.5"/>
    <path d="M12 18h.01"/>
</svg>

<svg th:fragment="macerador(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 16l1.465 1.638a2 2 0 1 1 -3.015 .099l1.55 -1.737z"/>
    <path d="M13.737 9.737c2.299 -2.3 3.23 -5.095 2.081 -6.245c-1.15 -1.15 -3.945 -.217 -6.244 2.082c-2.3 2.299 -3.231 5.095 -2.082 6.244c1.15 1.15 3.946 .218 6.245 -2.081z"/>
    <path d="M7.492 11.818c.362 .362 .768 .676 1.208 .934l6.895 4.047c1.078 .557 2.255 -.075 3.692 -1.512c1.437 -1.437 2.07 -2.614 1.512 -3.692c-.372 -.718 -1.72 -3.017 -4.047 -6.895a6.015 6.015 0 0 0 -.934 -1.208"/>
</svg>

<svg th:fragment="olla(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12h20"/>
    <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
    <path d="m4 8 16-4"/>
    <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/>
</svg>

<svg th:fragment="fermentador(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
</svg>

</html>
