<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Íconos de los cuatro tipos de equipamiento. Bootstrap Icons no tiene equivalentes que los
    representen, así que se usan SVG propios (olla: Lucide, licencia ISC) sin sumar librerías.
    Se pintan con el color del texto (currentColor).

    Parámetro: clases = clases de Tailwind para el tipo de caja, el tamaño y el espaciado. Junto a un
    texto: 'inline-block h-4 w-4 mr-1'; solo y centrado: 'block h-8 w-8 mx-auto'.
    Uso: <th:block th:replace="~{equipamiento/iconos :: molino('inline-block h-4 w-4 mr-1')}"></th:block>

    molino       -> molino de granos (tolva, rodillo y manivela)
    macerador    -> cuba con tapa y mosto
    olla         -> olla (hervido)
    fermentador  -> fermentador cilindro-cónico con patas y válvula de salida
-->

<svg th:fragment="molino(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3h16l-4 7H8z"/>
    <path d="M8 10h8v8H8z"/>
    <circle cx="12" cy="14" r="1.5"/>
    <path d="M16 12.5h4.5v4"/>
    <path d="M12 18v3"/>
    <path d="M5 21h14"/>
</svg>

<svg th:fragment="macerador(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h16v3H4z"/>
    <path d="M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/>
    <path d="M8 12c1.3-1 2.7-1 4 0s2.7 1 4 0"/>
    <path d="M8 16c1.3-1 2.7-1 4 0s2.7 1 4 0"/>
    <path d="M19 18h3"/>
</svg>

<svg th:fragment="olla(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12h20"/>
    <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
    <path d="m4 8 16-4"/>
    <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/>
</svg>

<svg th:fragment="fermentador(clases)" th:class="'shrink-0 ' + ${clases}" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h10v9l-3.5 6h-3L7 12z"/>
    <path d="M7 7h10"/>
    <path d="M12 18v3"/>
    <path d="M7 12l-2 9"/>
    <path d="M17 12l2 9"/>
</svg>

</html>
