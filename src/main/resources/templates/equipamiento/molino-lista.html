<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#molino-lista-content}, 'equipamiento')}">
<body>

<div id="molino-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Equipamiento</h1>
            <p class="text-sm text-slate-500">Molinos, maceradores, ollas de hervor y fermentadores de la planta, en orden alfabético.</p>
        </div>
        <a th:href="@{/equipamiento/molinos/nuevo}"
           class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nuevo molino
        </a>
    </div>

    <div th:replace="~{equipamiento/tabs :: tabs('molinos')}"></div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/equipamiento/molinos}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div>
            <label for="identificador" class="block text-xs font-medium text-slate-500 mb-1">Identificador</label>
            <input type="text" id="identificador" name="identificador" th:value="${filtroIdentificador}" autocomplete="off" placeholder="Ej: MOL-01"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="estadoOperativo" class="block text-xs font-medium text-slate-500 mb-1">Estado operativo</label>
            <select id="estadoOperativo" name="estadoOperativo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="e : ${estados}" th:value="${e}" th:selected="${e == filtroEstado}"
                        th:text="${e.etiqueta}">Disponible</option>
            </select>
        </div>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
            <a th:href="@{/equipamiento/molinos}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Identificador</th>
                <th class="px-4 py-3">Estado operativo</th>
                <th class="px-4 py-3">Rendimiento (kg/h)</th>
                <th class="px-4 py-3">Usos antes de mantenimiento</th>
                <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="x : ${molinos.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3">
                    <span class="font-medium text-slate-900" th:text="${x.identificadorInterno}">MOL-01</span>
                </td>
                <td class="px-4 py-3"><span th:replace="~{equipamiento/estado :: badge(${x.estadoOperativo})}"></span></td>
                <td class="px-4 py-3 text-slate-700" th:text="${#numbers.formatDecimal(x.rendimientoMolienda, 1, 'POINT', 2, 'COMMA')}">150,00</td>
                <td class="px-4 py-3 text-slate-700" th:text="${x.usosMaximosAntesMantenimiento}">50</td>
                <td class="px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                        <a th:href="@{/equipamiento/molinos/{id}/editar(id=${x.id})}" title="Editar molino" aria-label="Editar molino"
                           class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-lg"></i>
                        </a>
                        <button type="button" title="Dar de baja molino" aria-label="Dar de baja molino"
                                th:data-baja-url="@{/equipamiento/molinos/{id}/baja(id=${x.id})}"
                                th:data-baja-nombre="${x.identificadorInterno}"
                                class="p-2 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-lg"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${molinos.empty}">
                <td colspan="5" class="px-4 py-10 text-center text-slate-400">
                    <th:block th:replace="~{equipamiento/iconos :: molino('block h-8 w-8 mx-auto mb-2')}"></th:block>
                    No se encontraron molinos con los criterios indicados
                </td>
            </tr>
            </tbody>
        </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${molinos}, 'molinos',
                ${molinos.hasPrevious()} ? @{/equipamiento/molinos(pagina=${molinos.number - 1}, identificador=${filtroIdentificador}, estadoOperativo=${filtroEstado})} : null,
                ${molinos.hasNext()} ? @{/equipamiento/molinos(pagina=${molinos.number + 1}, identificador=${filtroIdentificador}, estadoOperativo=${filtroEstado})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja molino', 'Solo se puede dar de baja si está Disponible y no tiene lotes en estado Pendiente asociados.')}"></div>
</div>

</body>
</html>
