<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#equipamiento-detalle-content}, 'equipamiento')}">
<body>

<!--
    Detalle de un equipamiento: pantalla de solo lectura con su información. Pertenece a la Gestión de Equipamiento: se llega con el ojo de sus listas
    y con el identificador del equipo desde las pantallas de lote. Resalta esa opción del menú y vuelve a la lista del tipo del equipo.
-->
<div id="equipamiento-detalle-content" class="space-y-6">

    <!-- Encabezado -->
    <section data-equipo-cabecera class="space-y-4">
        <a th:href="@{${urlVolver}}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> <span th:text="${textoVolver}">Volver a molinos</span>
        </a>
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Detalle del equipamiento <span th:text="${equipo.identificadorInterno}">FER-01</span></h1>
                <span th:replace="~{equipamiento/estado :: badge(${equipo.estadoOperativo})}"></span>
            </div>
        </div>
    </section>

    <th:block th:replace="~{control_equipamiento/equipo-informacion :: informacion(${equipo})}"></th:block>
</div>

</body>
</html>
