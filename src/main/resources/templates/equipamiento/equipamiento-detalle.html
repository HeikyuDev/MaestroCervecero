<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#equipamiento-detalle-content}, 'control-equipamiento')}">
<body>

<!--
    Detalle de un equipamiento: pantalla de solo lectura con su información. Se llega con el identificador del equipo desde las
    pantallas de lote y desde la lista de control de equipamiento, y con el ojo desde la gestión de equipamiento.
-->
<div id="equipamiento-detalle-content" class="space-y-6">

    <!-- Encabezado -->
    <section data-equipo-cabecera class="space-y-4">
        <a th:href="@{/control-equipamiento}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Detalle del equipamiento <span th:text="${equipo.identificadorInterno}">FER-01</span></h1>
                <span th:replace="~{equipamiento/estado :: badge(${equipo.estadoOperativo})}"></span>
            </div>
        </div>
    </section>

    <th:block th:replace="~{control_equipamiento/equipo-informacion :: informacion(${equipo})}"></th:block>
</div>

</body>
</html>
