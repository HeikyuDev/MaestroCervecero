<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#control-historial-content}, 'control-barriles')}">
<body>

<!--
    Historial de un barril (solo el gerente de producción): su información y una tabla paginada, de la actividad más reciente a
    la más antigua, con los envasados en lotes y las limpiezas, fallas, fraccionamientos, mantenimientos, despachos y
    devoluciones registrados (las operaciones anuladas no aparecen). Cada fila informa en qué estado operativo dejó al barril.
    Se filtra por tipo y por fecha.
-->
<div id="control-historial-content" class="space-y-6">

    <!-- Encabezado -->
    <section data-barril-cabecera class="space-y-4">
        <a th:href="@{/control-barriles}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a control de barriles
        </a>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Historial del barril <span th:text="${barril.identificadorInterno}">BRL-01</span></h1>
            <span th:replace="~{barril/estado :: badge(${barril.estadoOperativo})}"></span>
        </div>
    </section>

    <th:block th:replace="~{control_barril/barril-informacion :: informacion(${barril})}"></th:block>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/control-barriles/{id}/historial(id=${barril.id})}" method="get" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-end">
        <div>
            <label for="tipo" class="block text-xs font-medium text-slate-500 mb-1">Tipo</label>
            <select id="tipo" name="tipo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:selected="${t == filtroTipo}" th:text="${t.etiqueta}">Envasado</option>
            </select>
        </div>
        <div>
            <label for="fechaDesde" class="block text-xs font-medium text-slate-500 mb-1">Fecha desde</label>
            <input type="date" id="fechaDesde" name="fechaDesde" th:value="${filtroFechaDesde}" autocomplete="off" placeholder="Ej: 01/07/2027"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="fechaHasta" class="block text-xs font-medium text-slate-500 mb-1">Fecha hasta</label>
            <input type="date" id="fechaHasta" name="fechaHasta" th:value="${filtroFechaHasta}" autocomplete="off" placeholder="Ej: 31/07/2027"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="md:col-span-2 lg:col-span-3 flex items-center justify-end gap-3">
            <a th:href="@{/control-barriles/{id}/historial(id=${barril.id})}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <section data-historial class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-4 py-3 whitespace-nowrap">Fecha y hora</th>
                    <th class="px-4 py-3">Operación</th>
                    <th class="px-4 py-3 whitespace-nowrap">Estado resultante</th>
                    <th class="col-acciones px-4 py-3 text-center whitespace-nowrap">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="a : ${actividades.content}" class="hover:bg-slate-50 align-top" th:attr="data-actividad-tipo=${a.tipo.name()}">
                    <td class="px-4 py-3 text-slate-700 whitespace-nowrap" data-actividad-fecha>
                        <th:block th:replace="~{planificacion_produccion/formato :: fechaHora(${a.fecha})}"></th:block>
                    </td>
                    <td class="px-4 py-3 text-slate-900 break-words" data-actividad-nombre
                        th:text="${a.tipo.name() == 'ENVASADO'} ? ${'Lote · ' + a.codigoLote + ' · ' + a.tipo.etiqueta} : ${a.tipo.etiqueta}">Lote · LOT-R1-01 · Envasado</td>
                    <td class="px-4 py-3 whitespace-nowrap" data-actividad-estado>
                        <th:block th:if="${a.estadoOperativoResultante != null}">
                            <span th:replace="~{barril/estado :: badge(${a.estadoOperativoResultante})}"></span>
                        </th:block>
                        <th:block th:if="${a.estadoOperativoResultante == null}">-</th:block>
                    </td>
                    <td class="col-acciones px-4 py-3">
                        <div class="flex items-center justify-center gap-1">
                            <th:block th:if="${a.tipo.name() != 'ENVASADO'}">
                                <th:block th:replace="~{fragments/detalle-anulacion :: observaciones(${a.tipo.tituloObservaciones}, ${a.observaciones}, ${a.fecha})}"></th:block>
                                <a th:href="@{/control-barriles/{id}/operaciones/{tipo}/{idOperacion}(id=${barril.id}, tipo=${#strings.toLowerCase(a.tipo.name())}, idOperacion=${a.idReferencia})}"
                                   data-ver-actividad th:aria-label="'Ver ' + ${#strings.toLowerCase(a.tipo.etiqueta)} + ' del ' + ${#temporals.format(a.fecha, 'dd/MM/yyyy HH:mm')}"
                                   class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                                    <i class="bi bi-eye text-lg"></i>
                                </a>
                            </th:block>
                            <a th:if="${a.tipo.name() == 'ENVASADO'}" th:href="@{/lotes/{id}/detalle(id=${a.idLote})}"
                               data-ver-actividad th:aria-label="'Ver el lote ' + ${a.codigoLote}"
                               class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                                <i class="bi bi-eye text-lg"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${actividades.empty}">
                    <td colspan="4" class="px-4 py-10 text-center text-slate-400">
                        <i class="bi bi-clock-history block text-3xl mb-2"></i>
                        <th:block th:if="${hayFiltros}">No se encontraron resultados</th:block>
                        <th:block th:unless="${hayFiltros}">El barril no tiene operaciones registradas</th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/paginacion :: paginacion(${actividades}, 'actividad|actividades',
                ${actividades.hasPrevious()} ? @{/control-barriles/{id}/historial(id=${barril.id}, pagina=${actividades.number - 1}, tipo=${filtroTipo}, fechaDesde=${filtroFechaDesde}, fechaHasta=${filtroFechaHasta})} : null,
                ${actividades.hasNext()} ? @{/control-barriles/{id}/historial(id=${barril.id}, pagina=${actividades.number + 1}, tipo=${filtroTipo}, fechaDesde=${filtroFechaDesde}, fechaHasta=${filtroFechaHasta})} : null,
                false)}"></div>
    </section>
</div>

</body>
</html>
