<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de insumos (maltas, lúpulos y levaduras) del catálogo del proveedor: criterios de
    filtro + resultados con "Elegir". El botón "Elegir" lleva en data-tipo el tipo del insumo, que la fila del
    catálogo muestra debajo del nombre.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar insumo</h3>
            <p class="text-sm text-slate-500">Filtre y elija el insumo.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{/proveedores/buscador/insumos}" method="get" data-modal-buscar
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div>
            <label for="buscador-nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="buscador-nombre" name="nombre" th:value="${filtroNombre}" autofocus autocomplete="off" placeholder="Ej: Pilsen"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-tipo" class="block text-xs font-medium text-slate-500 mb-1">Tipo</label>
            <select id="buscador-tipo" name="tipo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t.key}" th:selected="${t.key == filtroTipo}" th:text="${t.value}">Malta</option>
            </select>
        </div>
        <div class="sm:col-span-2 flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">Tipo</th>
                <th class="px-4 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="i : ${insumos.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${i.nombre}">Pilsen</td>
                <td class="px-4 py-3 text-slate-700" th:text="${tiposPorId.get(i.id)}">Malta</td>
                <td class="px-4 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${i.id}" th:data-texto="${i.nombre}" th:data-tipo="${tiposPorId.get(i.id)}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${insumos.empty}">
                <td colspan="3" class="px-4 py-8 text-center text-slate-400">No se encontraron insumos con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${insumos}, 'insumo|insumos',
                ${insumos.hasPrevious()} ? @{/proveedores/buscador/insumos(pagina=${insumos.number - 1}, nombre=${filtroNombre}, tipo=${filtroTipo})} : null,
                ${insumos.hasNext()} ? @{/proveedores/buscador/insumos(pagina=${insumos.number + 1}, nombre=${filtroNombre}, tipo=${filtroTipo})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
