<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Ventana emergente para agregar un ítem (insumo + presentación comercial) al catálogo del proveedor. La abre
    /js/proveedor-form.js desde el botón "Agregar ítem" (data-abrir-agregar) y, al confirmar, agrega una fila a la
    tabla del catálogo.

    El insumo y la presentación comercial se eligen con el selector de entidad compartido (campo en blanco con ícono de
    lista que abre el buscador). El diálogo va FUERA del <form> del proveedor: sus campos son solo de captura y nunca se
    envían; lo que viaja son los campos ocultos de las filas.

      data-error   avisos de la ventana (insumo, presentacion, duplicado), ocultos mientras no hagan falta. El aviso
                   de repetido va bajo el insumo, como en las ventanas de la receta.
                   /js/proveedor-form.js los muestra para impedir que entre a la tabla una fila incompleta o repetida;
                   el servidor vuelve a validar todo al enviar.
-->

<dialog th:fragment="catalogo" id="dialogo-agregar-catalogo" data-dialogo-agregar="catalogo"
        class="m-auto w-full max-w-lg rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
    <div class="p-6 space-y-5">
        <div class="flex items-start justify-between gap-4">
            <h3 class="text-lg font-semibold text-slate-900">Agregar ítem al catálogo</h3>
            <button type="button" data-cerrar-agregar title="Cerrar" aria-label="Cerrar"
                    class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <div data-selector-de="insumo">
                <span class="block text-sm font-medium text-slate-700 mb-1">Insumo <span class="text-rose-600" title="Obligatorio">*</span></span>
                <div th:replace="~{fragments/selector-entidad :: selector('idInsumo', null, null,
                        @{/proveedores/buscador/insumos}, null, null, false, false, 'Seleccione insumo')}"></div>
                <p data-error="insumo" hidden class="mt-1 text-xs text-rose-600">Seleccione insumo</p>
                <p data-error="duplicado" hidden class="mt-1 text-xs text-rose-600">Ese insumo ya está en el catálogo con la misma presentación comercial</p>
            </div>
            <div data-selector-de="presentacion">
                <span class="block text-sm font-medium text-slate-700 mb-1">Presentación comercial <span class="text-rose-600" title="Obligatorio">*</span></span>
                <div th:replace="~{fragments/selector-entidad :: selector('idPresentacionComercial', null, null,
                        @{/proveedores/buscador/presentaciones}, null, null, false, false, 'Seleccione presentación comercial')}"></div>
                <p data-error="presentacion" hidden class="mt-1 text-xs text-rose-600">Seleccione presentación comercial</p>
            </div>
        </div>

        <p class="text-xs text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>

        <div class="flex justify-end gap-3">
            <button type="button" data-cerrar-agregar
                    class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cancelar</button>
            <button type="button" data-confirmar-agregar
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">Agregar al catálogo</button>
        </div>
    </div>
</dialog>

</html>
