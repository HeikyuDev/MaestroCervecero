<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de presentaciones comerciales del catálogo del proveedor: criterios de filtro +
    resultados con "Elegir". El botón "Elegir" lleva en data-cantidad y data-unidad (símbolo) la medida de la
    presentación, que la fila del catálogo muestra debajo del nombre. data-cantidad ya viene con el texto de
    receta/formato :: numero (la misma expresión, porque un fragmento no se puede escribir dentro de un atributo):
    /js/proveedor-form.js solo le agrega la unidad y la fila queda igual que la que pinta el servidor.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar presentación comercial</h3>
            <p class="text-sm text-slate-500">Filtre y elija la presentación comercial.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{/proveedores/buscador/presentaciones}" method="get" data-modal-buscar
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div class="sm:col-span-2">
            <label for="buscador-nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="buscador-nombre" name="nombre" th:value="${filtroNombre}" autofocus autocomplete="off" placeholder="Ej: Bolsa de 25 Kg"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-cantidad" class="block text-xs font-medium text-slate-500 mb-1">Cantidad</label>
            <input type="number" id="buscador-cantidad" name="cantidad" th:value="${filtroCantidad}" min="0" step="any" autocomplete="off" placeholder="Ej: 25"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-unidad" class="block text-xs font-medium text-slate-500 mb-1">Unidad de medida</label>
            <select id="buscador-unidad" name="unidadDeMedida"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todas</option>
                <option th:each="u : ${unidades}" th:value="${u}" th:selected="${u == filtroUnidad}"><th:block th:replace="~{receta/formato :: unidadDeMedida(${u})}">Kilogramo (kg)</th:block></option>
            </select>
        </div>
        <div class="sm:col-span-2 flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3 whitespace-nowrap">Nombre</th>
                <th class="px-4 py-3 whitespace-nowrap">Cantidad</th>
                <th class="px-4 py-3 whitespace-nowrap">Unidad</th>
                <th class="px-4 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="p : ${presentaciones.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${p.nombre}">Bolsa de 25 Kg</td>
                <td class="px-4 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${p.cantidad})}"></th:block></td>
                <td class="px-4 py-3 text-slate-700 whitespace-nowrap" th:text="${p.unidadDeMedida?.simbolo}">kg</td>
                <td class="px-4 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${p.id}" th:data-texto="${p.nombre}"
                            th:data-cantidad="${p.cantidad == null} ? null : (${p.cantidad == p.cantidad.intValue()} ? ${#numbers.formatInteger(p.cantidad.intValue(), 1, 'POINT')} : ${#strings.replace(p.cantidad, '.', ',')})" th:data-unidad="${p.unidadDeMedida?.simbolo}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${presentaciones.empty}">
                <td colspan="4" class="px-4 py-8 text-center text-slate-400">No se encontraron presentaciones comerciales con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${presentaciones}, 'presentación|presentaciones',
                ${presentaciones.hasPrevious()} ? @{/proveedores/buscador/presentaciones(pagina=${presentaciones.number - 1}, nombre=${filtroNombre}, cantidad=${filtroCantidad}, unidadDeMedida=${filtroUnidad})} : null,
                ${presentaciones.hasNext()} ? @{/proveedores/buscador/presentaciones(pagina=${presentaciones.number + 1}, nombre=${filtroNombre}, cantidad=${filtroCantidad}, unidadDeMedida=${filtroUnidad})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
