<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/pantalla-publica :: cabecera('Enlace no válido')}"></head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 bg-grain relative">

<div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-amber-500/5 rounded-full blur-3xl"></div>
</div>

<div class="w-full max-w-md relative z-10">
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-8 shadow-2xl shadow-black/30">

        <div th:replace="~{fragments/pantalla-publica :: marca}"></div>

        <h2 class="text-lg font-semibold text-white mb-4">Restablecer contraseña</h2>

        <div th:replace="~{fragments/pantalla-publica :: alerta}"></div>

        <p class="text-sm text-slate-400 mb-6">
            Cada enlace sirve una sola vez y por tiempo limitado. Solicite un enlace nuevo para restablecer la contraseña.
        </p>

        <a th:href="@{/recuperar-contrasena}"
           class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-[0.98] text-white font-semibold rounded-xl transition-all shadow-lg shadow-amber-600/25 text-sm flex items-center justify-center gap-2">
            <i class="bi bi-envelope"></i>
            Solicitar un enlace nuevo
        </a>

        <div class="mt-6 text-center">
            <a th:href="@{/login}" class="text-sm font-medium text-amber-500 hover:text-amber-400 focus:outline-none focus-visible:underline">
                <i class="bi bi-arrow-left mr-1"></i>Volver a iniciar sesión
            </a>
        </div>

        <p th:replace="~{fragments/pantalla-publica :: pie}"></p>
    </div>
</div>

</body>
</html>
