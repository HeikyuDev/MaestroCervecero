<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/pantalla-publica :: cabecera('Restablecer contraseña')}"></head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 bg-grain relative">

<div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-amber-500/5 rounded-full blur-3xl"></div>
</div>

<div class="w-full max-w-md relative z-10">
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-8 shadow-2xl shadow-black/30">

        <div th:replace="~{fragments/pantalla-publica :: marca}"></div>

        <h2 class="text-lg font-semibold text-white mb-2">Restablecer contraseña</h2>
        <p class="text-sm text-slate-400 mb-6">Elija la contraseña nueva de su cuenta.</p>

        <form th:action="@{/restablecer-contrasena}" th:object="${restablecimientoForm}" method="post" novalidate class="space-y-5">

            <!-- El token del enlace viaja aparte del formulario -->
            <input type="hidden" name="token" th:value="${token}" />

            <!-- Reglas rechazadas que no corresponden a un campo -->
            <div th:if="${#fields.hasGlobalErrors()}"
                 class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3.5 rounded-xl text-sm flex items-center gap-3"
                 role="alert">
                <i class="bi bi-x-circle-fill text-lg flex-shrink-0"></i>
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</span>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="bi bi-lock mr-1.5 text-slate-500"></i>Contraseña nueva <span class="text-rose-500" title="Obligatorio">*</span>
                </label>
                <div class="relative">
                    <!-- th:field no se usa a propósito: nunca se re-muestra una contraseña al volver a renderizar -->
                    <input type="password"
                           id="password"
                           name="password"
                           class="w-full pl-4 pr-11 py-2.5 bg-slate-900/80 border rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 transition-all text-sm"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-rose-500' : 'border-slate-700'"
                           placeholder="Ej: Cebada2026"
                           autofocus
                           autocomplete="new-password" />
                    <button th:replace="~{fragments/pantalla-publica :: alternarContrasena('password')}"></button>
                </div>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1.5 text-xs text-rose-400"></p>
                <p th:unless="${#fields.hasErrors('password')}" th:text="${reglasPassword}" class="mt-1.5 text-xs text-slate-500"></p>
            </div>

            <div>
                <label for="confirmacionPassword" class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="bi bi-lock mr-1.5 text-slate-500"></i>Confirmación de la contraseña <span class="text-rose-500" title="Obligatorio">*</span>
                </label>
                <div class="relative">
                    <input type="password"
                           id="confirmacionPassword"
                           name="confirmacionPassword"
                           class="w-full pl-4 pr-11 py-2.5 bg-slate-900/80 border rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 transition-all text-sm"
                           th:classappend="${#fields.hasErrors('confirmacionPassword')} ? 'border-rose-500' : 'border-slate-700'"
                           placeholder="Repita la contraseña nueva"
                           autocomplete="new-password" />
                    <button th:replace="~{fragments/pantalla-publica :: alternarContrasena('confirmacionPassword')}"></button>
                </div>
                <p th:if="${#fields.hasErrors('confirmacionPassword')}" th:errors="*{confirmacionPassword}" class="mt-1.5 text-xs text-rose-400"></p>
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-[0.98] text-white font-semibold rounded-xl transition-all shadow-lg shadow-amber-600/25 text-sm mt-2 flex items-center justify-center gap-2">
                <i class="bi bi-check-lg"></i>
                Restablecer contraseña
            </button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/login}" class="text-sm font-medium text-amber-500 hover:text-amber-400 focus:outline-none focus-visible:underline">
                <i class="bi bi-arrow-left mr-1"></i>Volver a iniciar sesión
            </a>
        </div>

        <p th:replace="~{fragments/pantalla-publica :: pie}"></p>
    </div>
</div>

<script th:src="@{/js/mostrar-contrasena.js}"></script>
</body>
</html>
