<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda del insumo de un consumo: el criterio de nombre + resultados con "Elegir". Solo ofrece
    los insumos de la etapa del lote: en el consumo reservado, los que tienen saldo reservado; en el consumo directo, los
    que la etapa requiere. Cada fila trae el nombre, el tipo y lo requerido, reservado y consumido en la etapa. El botón
    "Elegir" lleva, además del id y el nombre, la unidad de medida del insumo. Si la etapa no admite consumos, el
    controller informa el motivo en mensajeBuscador y el fragmento no muestra criterios ni filas.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar insumo</h3>
            <p class="text-sm text-slate-500">Filtre y elija el insumo de la etapa que se consume</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p th:if="${mensajeBuscador != null}" data-mensaje-buscador class="p-6 text-sm text-slate-500" th:text="${mensajeBuscador}">La etapa de Maceración no admite consumos de insumo</p>

    <th:block th:if="${mensajeBuscador == null}">
        <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
              class="p-6 grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-4 items-end">
            <div>
                <label for="buscador-nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
                <input type="text" id="buscador-nombre" name="nombre" th:value="${filtroNombre}" autofocus autocomplete="off" placeholder="Ej: Cascade"
                       class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
            </div>
            <div class="flex justify-end">
                <button type="submit"
                        class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                    <i class="bi bi-search"></i> Buscar
                </button>
            </div>
        </form>

        <div class="border-t border-slate-100">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-3 whitespace-nowrap">Insumo</th>
                    <th class="px-3 py-3 whitespace-nowrap">Tipo</th>
                    <th class="px-3 py-3 whitespace-nowrap">Requerido</th>
                    <th class="px-3 py-3 whitespace-nowrap" title="Saldo reservado que todavía no se consumió">Reservado</th>
                    <th class="px-3 py-3 whitespace-nowrap">Consumido</th>
                    <th class="px-3 py-3 text-right"></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="f : ${filas}" th:with="r=${f.requerido}" class="hover:bg-slate-50">
                    <td class="px-3 py-3 font-medium text-slate-900 whitespace-nowrap" th:text="${r.insumo.nombre}">Cascade</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="${f.tipo}">Lúpulo</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${r.cantidadRequerida}, ${r.unidadDeMedida.simbolo})}"></th:block></td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${r.cantidadReservada}, ${r.unidadDeMedida.simbolo})}"></th:block></td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${r.cantidadConsumida}, ${r.unidadDeMedida.simbolo})}"></th:block></td>
                    <td class="px-3 py-3 text-right">
                        <button type="button" data-elegir th:data-id="${r.insumo.id}" th:data-texto="${r.insumo.nombre}"
                                th:data-unidad="${r.unidadDeMedida.simbolo}"
                                class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(filas)}">
                    <td colspan="6" class="px-4 py-8 text-center text-slate-400"
                        th:text="${reservado} ? 'No se encontraron insumos con saldo reservado para esta etapa con los criterios indicados' : 'No se encontraron insumos con los criterios indicados'">No se encontraron insumos con los criterios indicados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</div>

</body>
</html>
