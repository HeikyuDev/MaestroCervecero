<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#envasado-form-content}, 'lotes')}">
<body>

<!--
    Formulario de un envasado nuevo del lote. Es una página aparte: al registrar vuelve a la lista de envasados
    (Post-Redirect-Get) y un formulario inválido vuelve acá con sus errores y lo escrito. El barril se elige con el
    selector de entidad (buscador en modal de barriles Disponibles) y, al elegirlo, se muestran su fabricante y su
    capacidad (comportamiento de /js/envasado-form.js).
-->
<div id="envasado-form-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a envasados
        </a>
        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Nuevo envasado</h1>
            <p class="text-sm text-slate-500">
                &middot; Lote <strong class="text-slate-900" th:text="${lote.identificadorInterno}">LOT-R7-03</strong>
                <th:block th:if="${lote.versionReceta != null and lote.versionReceta.version != null}">&middot; <span data-lote-receta th:text="${lote.versionReceta.version.nombre}">Pale Ale</span></th:block>
                &middot; Etapa <strong class="text-slate-900">Envasado</strong>
            </p>
        </div>
        <p class="text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form id="envasado-form" th:action="@{${urlAccion}}" th:object="${envasadoForm}" method="post" novalidate data-un-solo-envio data-formulario-envasado
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <div th:replace="~{fragments/form-errors :: resumen('No se pudo crear el envasado')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Datos del envasado</h2>

            <!-- Una fila por tema: barril, cantidad y fecha -->
            <div class="space-y-5 mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <span class="block text-sm font-medium text-slate-700 mb-1">Barril <span class="text-rose-600" title="Obligatorio">*</span></span>
                        <div th:replace="~{fragments/selector-entidad :: selector('idBarril', ${idBarrilElegido}, ${barrilElegidoTexto},
                                ${urlBuscador}, null, null, false, ${formularioConError == true and #fields.hasErrors('idBarril')}, 'Seleccione barril')}"></div>
                        <p th:if="${formularioConError == true and #fields.hasErrors('idBarril')}" th:errors="*{idBarril}" class="mt-1 text-xs text-rose-600"></p>
                        <p data-barril-elegido th:hidden="${barrilElegido == null}" class="mt-2 text-xs text-slate-500">
                            Fabricante: <span data-barril-fabricante><th:block th:if="${barrilElegido != null and barrilElegido.fabricante != null}" th:text="${barrilElegido.fabricante.nombre}"></th:block></span>
                            &middot; Capacidad: <span data-barril-capacidad><th:block th:if="${barrilElegido != null}"><th:block th:replace="~{receta/formato :: medida(${barrilElegido.capacidad}, 'L')}"></th:block></th:block></span>
                        </p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label for="cantidad-envasado" class="block text-sm font-medium text-slate-700 mb-1">Cantidad a envasar <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <div th:replace="~{fragments/campo-unidad :: medida('cantidad', 'cantidad-envasado', ${formularioConError == true} ? ${cantidadEscrita}, 'Ej: 50', 'L', ${formularioConError == true and #fields.hasErrors('cantidad')}, null, null, 'any', true)}"></div>
                        <p th:if="${formularioConError == true and #fields.hasErrors('cantidad')}" th:errors="*{cantidad}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                    <div>
                        <label for="fecha-envasado" class="block text-sm font-medium text-slate-700 mb-1">Fecha y hora del envasado <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <input type="datetime-local" id="fecha-envasado" th:field="*{fechaEnvasado}" autocomplete="off" placeholder="Ej: 31/10/2026 08:30"
                               class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                               th:classappend="${formularioConError == true and #fields.hasErrors('fechaEnvasado')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                        <p th:if="${formularioConError == true and #fields.hasErrors('fechaEnvasado')}" th:errors="*{fechaEnvasado}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                </div>
            </div>
        </section>

        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">Crear envasado</button>
        </div>
    </form>

    <script th:src="@{/js/envasado-form.js}" defer></script>
</div>

</body>
</html>
