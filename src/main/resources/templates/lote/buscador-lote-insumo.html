<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de un lote de insumo de un consumo: criterios de insumo (texto con el nombre, nunca
    un desplegable) e identificación del lote + resultados con "Elegir". El controller ofrece, según el tipo de consumo,
    los lotes con saldo reservado para la etapa (reservado) o todos los lotes con saldo disponible de los insumos que la
    etapa requiere (directo), en orden FEFO: vigentes por vencimiento y los vencidos al final, marcados. Cada fila trae el
    lote y la cantidad que se ofrece (tituloCantidad: Reservado o Disponible). El botón "Elegir" lleva, además del id y el
    texto, los datos que la pantalla muestra del lote elegido (vencimiento, cantidad, unidad y si está vencido). Si la
    etapa no admite consumos, el controller informa el motivo en mensajeBuscador y el fragmento no muestra criterios ni
    filas.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar lote de insumo</h3>
            <p class="text-sm text-slate-500">Filtre y elija el lote del que se descuenta el consumo</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p th:if="${mensajeBuscador != null}" data-mensaje-buscador class="p-6 text-sm text-slate-500" th:text="${mensajeBuscador}">La etapa de Maceración no admite consumos de insumo</p>

    <th:block th:if="${mensajeBuscador == null}">
        <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
              class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
            <div>
                <label for="buscador-insumo" class="block text-xs font-medium text-slate-500 mb-1">Insumo</label>
                <input type="text" id="buscador-insumo" name="insumo" th:value="${filtroInsumo}" autofocus autocomplete="off" placeholder="Ej: Cascade"
                       class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
            </div>
            <div>
                <label for="buscador-identificacion" class="block text-xs font-medium text-slate-500 mb-1">Identificación del lote</label>
                <input type="text" id="buscador-identificacion" name="identificacion" th:value="${filtroIdentificacion}" autocomplete="off" placeholder="Ej: L-125"
                       class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
            </div>
            <div class="sm:col-span-2 flex justify-end">
                <button type="submit"
                        class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                    <i class="bi bi-search"></i> Buscar
                </button>
            </div>
        </form>

        <div class="border-t border-slate-100">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-3 whitespace-nowrap">Insumo</th>
                    <th class="px-3 py-3 whitespace-nowrap">Lote</th>
                    <th class="px-3 py-3 whitespace-nowrap">Vencimiento</th>
                    <th class="px-3 py-3 whitespace-nowrap" th:text="${tituloCantidad}">Disponible</th>
                    <th class="px-3 py-3 text-right"></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="f : ${filas.content}" th:with="l=${f.lote}" class="hover:bg-slate-50"
                    th:classappend="${l.vencido} ? 'bg-amber-50/40'">
                    <td class="px-3 py-3 font-medium text-slate-900 whitespace-nowrap" th:text="${l.insumo.nombre}">Cascade</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="${l.identificacionLoteProveedor}">L-125</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap">
                        <th:block th:replace="~{planificacion_produccion/formato :: fecha(${l.fechaVencimiento})}"></th:block>
                        <span th:if="${l.vencido}" class="ml-1 inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700">Vencido</span>
                    </td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: medida(${f.cantidad}, ${l.insumo.unidadDeMedida.simbolo})}"></th:block></td>
                    <td class="px-3 py-3 text-right">
                        <button type="button" data-elegir th:data-id="${l.id}" th:data-texto="|${l.insumo.nombre} - ${l.identificacionLoteProveedor}|"
                                th:data-vencimiento="${l.fechaVencimiento != null} ? ${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')} : '-'"
                                th:data-cantidad="${(f.cantidad == f.cantidad.intValue() ? #numbers.formatInteger(f.cantidad.intValue(), 1, 'POINT') : #strings.replace(f.cantidad, '.', ',')) + ' ' + l.insumo.unidadDeMedida.simbolo}"
                                th:data-unidad="${l.insumo.unidadDeMedida.simbolo}"
                                th:data-vencido="${l.vencido} ? 'true'"
                                class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                    </td>
                </tr>
                <tr th:if="${filas.empty}">
                    <td colspan="5" class="px-4 py-8 text-center text-slate-400">No se encontraron lotes de insumo con los criterios indicados</td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/paginacion :: paginacion(${filas}, 'lotes de insumo',
                    ${filas.hasPrevious()} ? @{${urlBuscador}(pagina=${filas.number - 1}, insumo=${filtroInsumo}, identificacion=${filtroIdentificacion})} : null,
                    ${filas.hasNext()} ? @{${urlBuscador}(pagina=${filas.number + 1}, insumo=${filtroInsumo}, identificacion=${filtroIdentificacion})} : null,
                    true)}"></div>
        </div>
    </th:block>
</div>

</body>
</html>
