<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#lote-form-content}, 'lotes')}">
<body>

<div id="lote-form-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a lotes
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight">Nuevo lote</h1>
        <p class="text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form id="lote-form" th:action="@{/lotes}" th:object="${loteForm}" method="post" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <!-- Resumen de todos los errores: campos inválidos (@Valid) y reglas de negocio del service -->
        <div th:replace="~{fragments/form-errors :: resumen('No se pudo crear el lote')}"></div>

        <!-- PLANIFICACIÓN -->
        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Planificación</h2>

            <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Planificación de producción <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idPlanificacionProduccion', *{idPlanificacionProduccion}, ${planificacionTexto},
                            @{/lotes/buscador/planificaciones}, null, null, false, ${#fields.hasErrors('idPlanificacionProduccion')}, 'Seleccione planificación')}"></div>
                    <p th:if="${#fields.hasErrors('idPlanificacionProduccion')}" th:errors="*{idPlanificacionProduccion}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
        </section>

        <!-- EQUIPAMIENTO -->
        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Equipamiento</h2>

            <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Molino <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idMolino', *{idMolino}, ${molinoTexto},
                            @{/lotes/buscador/molinos}, null, null, false, ${#fields.hasErrors('idMolino')}, 'Seleccione molino')}"></div>
                    <p th:if="${#fields.hasErrors('idMolino')}" th:errors="*{idMolino}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Macerador <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idMacerador', *{idMacerador}, ${maceradorTexto},
                            @{/lotes/buscador/maceradores}, null, null, false, ${#fields.hasErrors('idMacerador')}, 'Seleccione macerador')}"></div>
                    <p th:if="${#fields.hasErrors('idMacerador')}" th:errors="*{idMacerador}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Olla de hervor <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idOllaHervor', *{idOllaHervor}, ${ollaTexto},
                            @{/lotes/buscador/ollas}, null, null, false, ${#fields.hasErrors('idOllaHervor')}, 'Seleccione olla de hervor')}"></div>
                    <p th:if="${#fields.hasErrors('idOllaHervor')}" th:errors="*{idOllaHervor}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <span class="block text-sm font-medium text-slate-700 mb-1">Fermentador <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idFermentador', *{idFermentador}, ${fermentadorTexto},
                            @{/lotes/buscador/fermentadores}, null, null, false, ${#fields.hasErrors('idFermentador')}, 'Seleccione fermentador')}"></div>
                    <p th:if="${#fields.hasErrors('idFermentador')}" th:errors="*{idFermentador}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
        </section>

        <!-- PRODUCCIÓN -->
        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Producción</h2>

            <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div>
                    <label for="volumenObjetivo" class="block text-sm font-medium text-slate-700 mb-1">Volumen objetivo (L) <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="number" id="volumenObjetivo" name="volumenObjetivo"
                           th:value="${loteForm.volumenObjetivo != null ? (loteForm.volumenObjetivo == loteForm.volumenObjetivo.intValue() ? loteForm.volumenObjetivo.intValue() : loteForm.volumenObjetivo) : null}"
                           step="any" autocomplete="off" placeholder="Ej: 300"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('volumenObjetivo')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('volumenObjetivo')}" th:errors="*{volumenObjetivo}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
        </section>

        <!-- ACCIONES -->
        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
                Crear lote
            </button>
        </div>
    </form>
</div>

</body>
</html>
