<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de un barril del envasado: criterio de identificador (texto, nunca un
    desplegable) + resultados con "Elegir". El controller ofrece solo barriles Disponibles, en orden alfabético por
    identificador. El botón "Elegir" lleva, además del id y el texto, los datos que la pantalla muestra del barril
    elegido (fabricante y capacidad). Si el lote no existe, el controller informa el motivo en mensajeBuscador y el
    fragmento no muestra criterios ni filas.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar barril</h3>
            <p class="text-sm text-slate-500">Filtre y elija el barril en el que se envasa.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p th:if="${mensajeBuscador != null}" data-mensaje-buscador class="p-6 text-sm text-slate-500" th:text="${mensajeBuscador}">No se encontró el lote con ID: 99</p>

    <th:block th:if="${mensajeBuscador == null}">
        <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
              class="p-6 grid grid-cols-1 gap-4 items-end sm:grid-cols-[1fr_auto]">
            <div>
                <label for="buscador-identificador" class="block text-xs font-medium text-slate-500 mb-1">Identificador</label>
                <input type="text" id="buscador-identificador" name="identificador" th:value="${filtroIdentificador}" autofocus autocomplete="off" placeholder="Ej: B-001"
                       class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
            </div>
            <button type="submit"
                    class="inline-flex items-center justify-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </form>

        <div class="border-t border-slate-100">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-3 whitespace-nowrap">Identificador</th>
                    <th class="px-3 py-3 whitespace-nowrap">Capacidad (L)</th>
                    <th class="px-3 py-3 whitespace-nowrap">Fabricante</th>
                    <th class="px-3 py-3 whitespace-nowrap">Estado</th>
                    <th class="px-3 py-3 text-right"></th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="b : ${barriles.content}" class="hover:bg-slate-50">
                    <td class="px-3 py-3 font-medium text-slate-900 whitespace-nowrap" th:text="${b.identificador}">B-001</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${b.capacidad})}"></th:block></td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="${b.fabricante != null} ? ${b.fabricante.nombre} : '-'">Barrilitos SA</td>
                    <td class="px-3 py-3 text-slate-700 whitespace-nowrap" th:text="${b.estadoOperativo.etiqueta}">Disponible</td>
                    <td class="px-3 py-3 text-right">
                        <button type="button" data-elegir th:data-id="${b.id}" th:data-texto="${b.identificador}"
                                th:data-fabricante="${b.fabricante != null} ? ${b.fabricante.nombre} : '-'"
                                th:data-capacidad="${b.capacidad == b.capacidad.intValue() ? #numbers.formatInteger(b.capacidad.intValue(), 1, 'POINT') : #strings.replace(b.capacidad, '.', ',')}"
                                class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                    </td>
                </tr>
                <tr th:if="${barriles.empty}">
                    <td colspan="5" class="px-4 py-8 text-center text-slate-400">No se encontraron barriles disponibles con los criterios indicados</td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/paginacion :: paginacion(${barriles}, 'barriles',
                    ${barriles.hasPrevious()} ? @{${urlBuscador}(pagina=${barriles.number - 1}, identificador=${filtroIdentificador})} : null,
                    ${barriles.hasNext()} ? @{${urlBuscador}(pagina=${barriles.number + 1}, identificador=${filtroIdentificador})} : null,
                    true)}"></div>
        </div>
    </th:block>
</div>

</body>
</html>
