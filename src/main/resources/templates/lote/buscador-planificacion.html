<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de planificaciones: criterio de receta + resultados con "Elegir". Lo comparten el
    buscador del formulario de registro (solo pendientes) y el del filtro de la lista (cualquier estado): el
    controller indica la URL del buscador (urlBuscador) y la frase que explica para qué se elige (subtituloBuscador).
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900">Buscar planificación</h3>
            <p class="text-sm text-slate-500" th:text="${subtituloBuscador}">Filtre y elija la planificación.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
          class="p-6 grid grid-cols-1 gap-4 items-end">
        <div>
            <label for="buscador-receta" class="block text-xs font-medium text-slate-500 mb-1">Receta</label>
            <input type="text" id="buscador-receta" name="receta" th:value="${filtroReceta}" autofocus autocomplete="off" placeholder="Ej: Pale Ale"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div class="flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-3 whitespace-nowrap">Planificación</th>
                <th class="px-3 py-3 whitespace-nowrap">Receta</th>
                <th class="px-3 py-3 whitespace-nowrap">Cantidad (L)</th>
                <th class="px-3 py-3 whitespace-nowrap">Inicio estimado</th>
                <th class="px-3 py-3 whitespace-nowrap">Estado</th>
                <th class="px-3 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="p : ${planificaciones.content}" class="hover:bg-slate-50">
                <td class="px-3 py-3 font-medium text-slate-900 whitespace-nowrap" th:text="|#${p.id}|">#7</td>
                <td class="px-3 py-3 text-slate-900 whitespace-nowrap" th:text="${p.versionReceta.nombre}">Pale Ale</td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${p.cantidadAProducir})}"></th:block></td>
                <td class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{planificacion_produccion/formato :: fecha(${p.fechaInicioEstimada})}"></th:block></td>
                <td class="px-3 py-3 whitespace-nowrap"><span th:replace="~{planificacion_produccion/formato :: estadoPlanificacion(${p.estado})}"></span></td>
                <td class="px-3 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${p.id}" th:data-texto="|Plan #${p.id} - ${p.versionReceta.nombre}|"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${planificaciones.empty}">
                <td colspan="6" class="px-4 py-8 text-center text-slate-400">No se encontraron planificaciones con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${planificaciones}, 'planificaciones',
                ${planificaciones.hasPrevious()} ? @{${urlBuscador}(pagina=${planificaciones.number - 1}, receta=${filtroReceta})} : null,
                ${planificaciones.hasNext()} ? @{${urlBuscador}(pagina=${planificaciones.number + 1}, receta=${filtroReceta})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
