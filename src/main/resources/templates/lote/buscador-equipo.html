<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Contenido del modal de búsqueda de un equipo del formulario de registro de lotes (molino, macerador, olla de
    hervor o fermentador): criterios de identificador y estado operativo + resultados con "Elegir". Se ofrecen todos
    los equipos activos, con su estado operativo, porque el registro no exige disponibilidad (la valida el inicio).
    Los cuatro equipos comparten esta vista: el controller indica el nombre, el ejemplo del identificador, la URL del
    buscador y las columnas propias de cada tipo.
-->
<div th:fragment="buscador">

    <div class="flex items-start justify-between gap-4 p-6 pb-0">
        <div>
            <h3 class="text-lg font-semibold text-slate-900" th:text="|Buscar ${nombreEquipo}|">Buscar molino</h3>
            <p class="text-sm text-slate-500">Filtre y elija el equipo del lote.</p>
        </div>
        <button type="button" data-cerrar-modal title="Cerrar" aria-label="Cerrar"
                class="p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p th:if="${avisoBuscador != null}" data-aviso-buscador role="alert"
       class="mx-6 mt-4 p-3 rounded-lg border bg-amber-50 border-amber-200 text-amber-800 text-sm" th:text="${avisoBuscador}">El estado operativo indicado no es válido, se muestran todos</p>

    <form th:action="@{${urlBuscador}}" method="get" data-modal-buscar novalidate
          class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div>
            <label for="buscador-identificador" class="block text-xs font-medium text-slate-500 mb-1">Identificador</label>
            <input type="text" id="buscador-identificador" name="identificador" th:value="${filtroIdentificador}" autofocus autocomplete="off"
                   th:placeholder="|Ej: ${ejemploIdentificador}|"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <label for="buscador-estado-operativo" class="block text-xs font-medium text-slate-500 mb-1">Estado operativo</label>
            <select id="buscador-estado-operativo" name="estadoOperativo"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
                <option value="">Todos</option>
                <option th:each="e : ${estados}" th:value="${e}" th:selected="${e == filtroEstado}" th:text="${e.etiqueta}">Disponible</option>
            </select>
        </div>
        <div class="sm:col-span-2 flex justify-end">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <div class="border-t border-slate-100">
        <table class="tabla-buscador">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-3 whitespace-nowrap">Identificador</th>
                <th class="px-3 py-3 whitespace-nowrap">Estado</th>
                <th th:each="columna : ${columnas}" class="px-3 py-3 whitespace-nowrap" th:text="${columna}">Capacidad útil (L)</th>
                <th class="px-3 py-3 text-right"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="f : ${filas.content}" class="hover:bg-slate-50">
                <td class="px-3 py-3 font-medium text-slate-900" th:text="${f.identificador}">M-01</td>
                <td class="px-3 py-3 whitespace-nowrap"><span th:replace="~{equipamiento/estado :: badge(${f.estadoOperativo})}"></span></td>
                <td th:each="valor : ${f.valores}" class="px-3 py-3 text-slate-700 whitespace-nowrap"><th:block th:replace="~{receta/formato :: numero(${valor})}"></th:block></td>
                <td class="px-3 py-3 text-right">
                    <button type="button" data-elegir th:data-id="${f.id}" th:data-texto="${f.identificador}"
                            class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white hover:bg-amber-600 transition-colors">Elegir</button>
                </td>
            </tr>
            <tr th:if="${filas.empty}">
                <td th:colspan="${3 + #lists.size(columnas)}" class="px-4 py-8 text-center text-slate-400"
                    th:text="|No se encontraron ${nombreEquipoPlural} con los criterios indicados|">No se encontraron molinos con los criterios indicados</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${filas}, ${nombreEquipo + '|' + nombreEquipoPlural},
                ${filas.hasPrevious()} ? @{${urlBuscador}(pagina=${filas.number - 1}, identificador=${filtroIdentificador}, estadoOperativo=${filtroEstado})} : null,
                ${filas.hasNext()} ? @{${urlBuscador}(pagina=${filas.number + 1}, identificador=${filtroIdentificador}, estadoOperativo=${filtroEstado})} : null,
                true)}"></div>
    </div>
</div>

</body>
</html>
