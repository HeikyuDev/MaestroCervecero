<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#consumo-form-content}, 'lotes')}">
<body>

<!--
    Formulario de un consumo de la etapa (reservado o directo). Es una página aparte: al registrar vuelve a la pestaña
    del tipo de consumo en la pantalla de consumos (Post-Redirect-Get) y un formulario inválido vuelve acá con sus
    errores. El insumo y el lote de insumo se eligen con el buscador en modal. El insumo es el primer paso: en el consumo
    reservado solo se ofrecen los insumos de la etapa con saldo reservado y en el directo los que la etapa requiere. El
    lote de insumo queda deshabilitado hasta elegir el insumo y solo ofrece los lotes de ese insumo (con saldo reservado
    para la etapa en el reservado, disponibles en FEFO en el directo). Al cambiar el insumo se quita el lote elegido. La
    unidad se muestra como sufijo de la cantidad al elegir el insumo (comportamiento de /js/consumo-lista.js).
-->
<div id="consumo-form-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i> Volver a consumos
        </a>
        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight"
                th:text="${reservado} ? 'Nuevo consumo reservado' : 'Nuevo consumo directo'">Nuevo consumo reservado</h1>
            <p class="text-sm text-slate-500">
                &middot; Lote <strong class="text-slate-900" th:text="${lote.identificadorInterno}">LOT-R7-03</strong>
                <th:block th:if="${lote.versionReceta != null and lote.versionReceta.version != null}">&middot; <span data-lote-receta th:text="${lote.versionReceta.version.nombre}">Pale Ale</span></th:block>
                &middot; Etapa <strong class="text-slate-900" th:text="${tipoEtapa.etiqueta}">Molienda</strong>
            </p>
        </div>
        <p class="mt-1 text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.</p>
    </div>

    <form id="consumo-form" th:action="@{${urlAccion}}" th:object="${consumoForm}" method="post" novalidate data-un-solo-envio data-formulario-consumo
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <div th:replace="~{fragments/form-errors :: resumen('No se pudo crear el consumo')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
                th:text="${reservado} ? 'Datos del consumo reservado' : 'Datos del consumo directo'">Datos del consumo reservado</h2>

            <!-- Una fila por tema: origen del insumo y cantidad -->
            <div class="space-y-5 mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <span class="block text-sm font-medium text-slate-700 mb-1">Insumo <span class="text-rose-600" title="Obligatorio">*</span></span>
                        <div th:replace="~{fragments/selector-entidad :: selector('idInsumo', ${idInsumoElegido}, ${insumoElegidoTexto},
                                ${urlBuscadorInsumos}, null, null, false, ${#fields.hasErrors('idInsumo')}, 'Seleccione insumo')}"></div>
                        <p th:if="${#fields.hasErrors('idInsumo')}" th:errors="*{idInsumo}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                    <div>
                        <span class="block text-sm font-medium text-slate-700 mb-1">Lote de insumo <span class="text-rose-600" title="Obligatorio">*</span></span>
                        <div data-selector-lote th:data-buscador-base="${urlBuscador}" th:data-deshabilitado="${idInsumoElegido == null} ? 'true'"
                             th:classappend="${idInsumoElegido == null} ? 'opacity-50'">
                        <div th:replace="~{fragments/selector-entidad :: selector('idLoteInsumo', ${idLoteElegido}, ${loteElegidoTexto},
                                ${idInsumoElegido != null} ? ${urlBuscador + '?idInsumo=' + idInsumoElegido} : ${urlBuscador}, null, null, false, ${#fields.hasErrors('idLoteInsumo')}, 'Seleccione lote de insumo')}"></div>
                        </div>
                        <p data-ayuda-lote th:hidden="${idInsumoElegido != null}" class="mt-1 text-xs text-slate-500">Elija primero el insumo.</p>
                        <p th:if="${#fields.hasErrors('idLoteInsumo')}" th:errors="*{idLoteInsumo}" class="mt-1 text-xs text-rose-600"></p>
                        <p data-lote-elegido th:hidden="${loteElegido == null}" class="mt-2 text-xs text-slate-500">
                            Vencimiento: <span data-lote-vencimiento><th:block th:if="${loteElegido != null}"><th:block th:replace="~{planificacion_produccion/formato :: fecha(${loteElegido.fechaVencimiento})}"></th:block></th:block></span>
                            <span data-lote-vencido th:hidden="${loteElegido == null or !loteElegido.vencido}"><span class="ml-1 inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700">Vencido</span></span>
                            <span data-lote-cantidad-bloque th:hidden="${reservado or loteElegido == null}">&middot; <span data-lote-cantidad-titulo th:text="${reservado} ? 'Reservado' : 'Disponible'">Disponible</span>: <span data-lote-cantidad><th:block th:if="${!reservado and loteElegido != null}"><th:block th:replace="~{receta/formato :: medida(${loteElegido.cantidadDisponible}, ${loteElegido.insumo.unidadDeMedida.simbolo})}"></th:block></th:block></span></span>
                        </p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label for="cantidadConsumida" class="block text-sm font-medium text-slate-700 mb-1">Cantidad <span class="text-rose-600" title="Obligatorio">*</span></label>
                        <div th:replace="~{fragments/campo-unidad :: numero('cantidadConsumida', ${cantidadEscrita}, 'Ej: 10',
                                ${loteElegido != null} ? ${loteElegido.insumo.unidadDeMedida.simbolo} : ${unidadInsumoElegido}, '', ${#fields.hasErrors('cantidadConsumida')})}"></div>
                        <p th:if="${#fields.hasErrors('cantidadConsumida')}" th:errors="*{cantidadConsumida}" class="mt-1 text-xs text-rose-600"></p>
                    </div>
                </div>
            </div>
        </section>

        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors"
                    th:text="${reservado} ? 'Crear consumo reservado' : 'Crear consumo directo'">Crear consumo</button>
        </div>
    </form>

    <script th:src="@{/js/consumo-lista.js}" defer></script>
</div>

</body>
</html>
