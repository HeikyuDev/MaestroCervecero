<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<!-- Pestañas de Configuración de Producción (componente fragments/pestanas): cada una es su propia URL y se muestra según los permisos. activa = 'parametros' | 'costos' -->
<th:block th:fragment="tabs(activa)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Configuración de Producción', 'configuracion', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <th:block sec:authorize="hasRole('GERENTE_DE_PRODUCCION')">
                <a th:replace="~{fragments/pestanas :: pestana(@{/configuracion-produccion}, ${activa == 'parametros'}, 'parametros', ~{fragments/pestanas :: bi('bi-sliders')}, 'Parámetros de producción')}"></a>
            </th:block>
            <th:block sec:authorize="hasAuthority('COSTO_DIRECTO_ADICIONAL_CONSULTAR')">
                <a th:replace="~{fragments/pestanas :: pestana(@{/configuracion-produccion/costos-directos-adicionales}, ${activa == 'costos'}, 'costos', ~{fragments/pestanas :: bi('bi-cash-coin')}, 'Costos directos adicionales')}"></a>
            </th:block>
        </th:block>
    </th:block>
</th:block>

</html>
