<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Maestro Cervecero</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/logo-32x32.ico}" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-2%, -2%); }
            30% { transform: translate(1%, -3%); }
            50% { transform: translate(-1%, 2%); }
            70% { transform: translate(3%, 1%); }
            90% { transform: translate(2%, -1%); }
        }
        .bg-grain::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            animation: grain 8s steps(10) infinite;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 bg-grain relative">

<!-- Decorative radial glow -->
<div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-amber-500/5 rounded-full blur-3xl"></div>
</div>

<div class="w-full max-w-md relative z-10">
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-8 shadow-2xl shadow-black/30">

        <!-- Header con Identidad Visual -->
        <div class="text-center mb-8">
            <img th:src="@{/img/logo-256x256.png}" alt="Logo Maestro Cervecero"
                 class="w-24 h-24 mx-auto mb-4 drop-shadow-lg" />
            <h1 class="text-2xl font-extrabold tracking-tight text-white">
                MAESTRO<span class="text-amber-500">CERVECERO</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1.5">Gestión Integral de Producción</p>
        </div>

        <!-- Alerta: Error de autenticación -->
        <div th:if="${error}"
             class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6"
             role="alert">
            <i class="bi bi-x-circle-fill text-lg flex-shrink-0"></i>
            <span>Usuario o contraseña incorrectos.</span>
        </div>

        <!-- Alerta: Cierre de Sesión Exitoso -->
        <div th:if="${logout}"
             class="bg-teal-500/10 border border-teal-500/30 text-teal-400 p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6"
             role="alert">
            <i class="bi bi-check-circle-fill text-lg flex-shrink-0"></i>
            <span>Has cerrado sesión correctamente.</span>
        </div>

        <!-- Alerta: Mensaje Dinámico Personalizado -->
        <div th:if="${mensaje != null}"
             th:class="'p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6 border ' +
                        (${tipo == 'danger'} ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' :
                        (${tipo == 'success'} ? 'bg-teal-500/10 border-teal-500/30 text-teal-400' :
                        (${tipo == 'warning'} ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' :
                        'bg-blue-500/10 border-blue-500/30 text-blue-400')))"
             role="alert">
            <i th:class="'bi text-lg flex-shrink-0 ' +
                          (${tipo == 'danger'} ? 'bi-x-circle-fill' :
                          (${tipo == 'success'} ? 'bi-check-circle-fill' :
                          (${tipo == 'warning'} ? 'bi-exclamation-triangle-fill' :
                          'bi-info-circle-fill')))"></i>
            <span th:text="${mensaje}">Mensaje del sistema</span>
        </div>

        <!-- Formulario de Autenticación -->
        <form th:action="@{/login}" method="post" class="space-y-5">

            <!-- Redirección oculta si viene informada -->
            <input th:if="${redirect != null and !redirect.isBlank()}"
                   type="hidden"
                   name="redirect"
                   th:value="${redirect}" />

            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="bi bi-person mr-1.5 text-slate-500"></i>Nombre de Usuario
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 transition-all text-sm"
                       placeholder="Ej: admin"
                       required
                       autofocus
                       autocomplete="username" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                    <i class="bi bi-lock mr-1.5 text-slate-500"></i>Contraseña
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 transition-all text-sm"
                       placeholder="••••••••"
                       required
                       autocomplete="current-password" />
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-[0.98] text-white font-semibold rounded-xl transition-all shadow-lg shadow-amber-600/25 text-sm mt-2 flex items-center justify-center gap-2">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-8">
            &copy; 2026 Maestro Cervecero. Todos los derechos reservados.
        </p>
    </div>
</div>

</body>
</html>
