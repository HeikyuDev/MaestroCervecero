<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Maestro Cervecero</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">

        <!-- Header con Identidad Visual -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-amber-600 rounded-xl mb-3 shadow-lg shadow-amber-600/30">
                <svg class="w-7 h-7 fill-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2 0v20c5.07-.5 9-4.79 9-10s-3.93-9.5-9-10z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Maestro Cervecero</h1>
            <p class="text-sm text-slate-400 mt-1">Gestión Integral de Producción</p>
        </div>

        <!-- Alerta 1: Error estándar de Spring Security -->
        <div th:if="${error}" class="bg-red-950/60 border border-red-800/80 text-red-300 p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6" role="alert">
            <svg class="w-5 h-5 flex-shrink-0 text-red-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Usuario o contraseña incorrectos.</span>
        </div>

        <!-- Alerta 2: Cierre de Sesión Exitoso -->
        <div th:if="${logout}" class="bg-emerald-950/60 border border-emerald-800/80 text-emerald-300 p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6" role="alert">
            <svg class="w-5 h-5 flex-shrink-0 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>Has cerrado sesión correctamente.</span>
        </div>

        <!-- Alerta 3: Mensaje Dinámico Personalizado (danger, success, info, warning) -->
        <div th:if="${mensaje != null}"
             th:class="'p-3.5 rounded-xl text-sm flex items-center gap-3 mb-6 border ' +
                       (${tipo} == 'danger' ? 'bg-red-950/60 border-red-800/80 text-red-300' :
                       (${tipo} == 'success' ? 'bg-emerald-950/60 border-emerald-800/80 text-emerald-300' :
                       (${tipo} == 'warning' ? 'bg-amber-950/60 border-amber-800/80 text-amber-300' :
                       'bg-blue-950/60 border-blue-800/80 text-blue-300')))"
             role="alert">
            <svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span th:text="${mensaje}">Mensaje del sistema</span>
        </div>

        <!-- Formulario Autenticado Spring Security -->
        <form th:action="@{/login}" method="post" class="space-y-5">

            <!-- Redirección oculta si viene informada -->
            <input th:if="${redirect != null and !redirect.isBlank()}"
                   type="hidden"
                   name="redirect"
                   th:value="${redirect}" />

            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Nombre de Usuario</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-colors text-sm"
                       placeholder="Ej: admin"
                       required
                       autofocus
                       autocomplete="username" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-colors text-sm"
                       placeholder="••••••••"
                       required
                       autocomplete="current-password" />
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-amber-600 hover:bg-amber-700 active:scale-[0.99] text-white font-semibold rounded-xl transition-all shadow-lg shadow-amber-600/20 text-sm mt-2">
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-8">
            © 2026 Maestro Cervecero. Todos los derechos reservados.
        </p>
    </div>
</div>

</body>
</html>
