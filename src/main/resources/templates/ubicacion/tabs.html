<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Pestañas del módulo de ubicaciones (componente fragments/pestanas): cada una es su propia URL. activa = 'paises' | 'provincias' | 'localidades' -->
<th:block th:fragment="tabs(activa)">
    <th:block th:replace="~{fragments/pestanas :: pestanas('Ubicaciones', 'ubicaciones', ~{::enlaces})}">
        <th:block th:fragment="enlaces">
            <a th:replace="~{fragments/pestanas :: pestana(@{/ubicaciones/paises}, ${activa == 'paises'}, 'paises', ~{fragments/pestanas :: bi('bi-globe-americas')}, 'Países')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/ubicaciones/provincias}, ${activa == 'provincias'}, 'provincias', ~{fragments/pestanas :: bi('bi-map')}, 'Provincias')}"></a>
            <a th:replace="~{fragments/pestanas :: pestana(@{/ubicaciones/localidades}, ${activa == 'localidades'}, 'localidades', ~{fragments/pestanas :: bi('bi-geo-alt')}, 'Localidades')}"></a>
        </th:block>
    </th:block>
</th:block>

</html>
