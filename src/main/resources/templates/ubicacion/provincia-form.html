<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#provincia-form-content}, 'ubicaciones')}">
<body>

<!-- editando = true cuando se modifica una provincia existente (llega provinciaId), false en el alta -->
<div id="provincia-form-content" class="space-y-6" th:with="editando=${provinciaId != null}">

    <!-- Encabezado de la página -->
    <div>
        <a th:href="${urlCancelar}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-amber-600 transition-colors">
            <i class="bi bi-arrow-left"></i>
            <span th:text="${retorno != null} ? 'Volver al formulario anterior' : 'Volver a provincias'">Volver a provincias</span>
        </a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900 tracking-tight"
            th:text="${editando} ? 'Editar provincia' : 'Nueva provincia'">Nueva provincia</h1>
        <p class="text-sm text-slate-500">Los campos marcados con <span class="text-rose-600 font-semibold">*</span> son obligatorios.
            <span th:if="${retorno != null}">Al guardar volvés al formulario que estabas completando.</span></p>
    </div>

    <form th:action="${editando} ? @{/ubicaciones/provincias/{id}(id=${provinciaId})} : @{/ubicaciones/provincias}"
          th:object="${provinciaForm}" method="post" novalidate
          class="bg-white border border-slate-200 rounded-xl shadow-sm divide-y divide-slate-100">

        <input type="hidden" name="retorno" th:if="${retorno != null}" th:value="${retorno}">
        <input type="hidden" name="campo" th:if="${retorno != null and campo != null}" th:value="${campo}">

        <!-- Resumen de todos los errores: campos inválidos (@Valid) y reglas de negocio del service -->
        <div th:replace="~{fragments/form-errors :: resumen(${editando} ? 'No se pudo modificar la provincia' : 'No se pudo crear la provincia')}"></div>

        <section class="p-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Datos de la provincia</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre <span class="text-rose-600" title="Obligatorio">*</span></label>
                    <input type="text" id="nombre" th:field="*{nombre}" autofocus autocomplete="off"
                           class="w-full px-3 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'border-rose-400 bg-rose-50' : 'border-slate-300'">
                    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <!-- La opción "Crear nuevo país" del menú solo se ofrece a quien puede crearlo -->
                <div class="xl:col-span-2">
                    <span class="block text-sm font-medium text-slate-700 mb-1">País <span class="text-rose-600" title="Obligatorio">*</span></span>
                    <div th:replace="~{fragments/selector-entidad :: selector('idPais', *{idPais}, ${paisSeleccionado},
                            @{/ubicaciones/paises/buscador},
                            ${#authorization.expression('hasRole(''ADMINISTRADOR'')')} ? @{/ubicaciones/paises/nuevo} : null,
                            'Crear nuevo país', false, ${#fields.hasErrors('idPais')})}"></div>
                    <p th:if="${#fields.hasErrors('idPais')}" th:errors="*{idPais}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
        </section>

        <!-- ACCIONES -->
        <div class="p-6 flex items-center justify-end gap-3 bg-slate-50 rounded-b-xl">
            <a th:href="${urlCancelar}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</a>
            <button type="submit"
                    class="px-5 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors"
                    th:text="${editando} ? 'Guardar cambios' : 'Crear provincia'">
                Crear provincia
            </button>
        </div>
    </form>
</div>

</body>
</html>
