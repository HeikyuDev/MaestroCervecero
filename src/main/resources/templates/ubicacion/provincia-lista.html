<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: layout(~{::#provincia-lista-content}, 'ubicaciones')}">
<body>

<div id="provincia-lista-content" class="space-y-6">

    <!-- Encabezado de la página -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Ubicaciones</h1>
            <p class="text-sm text-slate-500">Países, provincias y localidades del sistema, en orden alfabético.</p>
        </div>
        <a th:href="@{/ubicaciones/provincias/nuevo}"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition-colors">
            <i class="bi bi-plus-lg"></i> Nueva provincia
        </a>
    </div>

    <div th:replace="~{ubicacion/tabs :: tabs('provincias')}"></div>

    <!-- Criterios de búsqueda -->
    <form th:action="@{/ubicaciones/provincias}" method="get"
          class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div>
            <label for="nombre" class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${filtroNombre}" autocomplete="off"
                   class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500">
        </div>
        <div>
            <span class="block text-xs font-medium text-slate-500 mb-1">País</span>
            <div th:replace="~{fragments/selector-entidad :: selector('idPais', ${filtroIdPais}, ${filtroPaisTexto},
                    @{/ubicaciones/paises/buscador}, null, null, true, false, 'Seleccionar país')}"></div>
        </div>
        <div class="md:col-span-2 flex items-center justify-end gap-3">
            <a th:href="@{/ubicaciones/provincias}"
               class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Limpiar</a>
            <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white hover:bg-slate-900 shadow-sm transition-colors">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>

    <!-- Resultados -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-4 py-3">Nombre</th>
                <th class="px-4 py-3">País</th>
                <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="p : ${provincias.content}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${p.nombre}">Córdoba</td>
                <td class="px-4 py-3 text-slate-700" th:text="${p.pais.nombre}">Argentina</td>
                <td class="px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                        <a th:href="@{/ubicaciones/provincias/{id}/editar(id=${p.id})}"
                           title="Editar provincia" aria-label="Editar provincia"
                           class="p-2 rounded-lg text-slate-500 hover:bg-amber-50 hover:text-amber-600 transition-colors">
                            <i class="bi bi-pencil-square text-lg"></i>
                        </a>
                        <button type="button" title="Dar de baja provincia" aria-label="Dar de baja provincia"
                                th:data-baja-url="@{/ubicaciones/provincias/{id}/baja(id=${p.id})}"
                                th:data-baja-nombre="${p.nombre}"
                                class="p-2 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
                            <i class="bi bi-trash text-lg"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${provincias.empty}">
                <td colspan="3" class="px-4 py-10 text-center text-slate-400">
                    <i class="bi bi-map text-3xl block mb-2"></i>
                    No se encontraron provincias con los criterios indicados.
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/paginacion :: paginacion(${provincias}, 'provincias',
                ${provincias.hasPrevious()} ? @{/ubicaciones/provincias(pagina=${provincias.number - 1}, nombre=${filtroNombre}, idPais=${filtroIdPais})} : null,
                ${provincias.hasNext()} ? @{/ubicaciones/provincias(pagina=${provincias.number + 1}, nombre=${filtroNombre}, idPais=${filtroIdPais})} : null,
                false)}"></div>
    </div>

    <div th:replace="~{fragments/dialogo-baja :: dialogo('Dar de baja provincia', 'Si tiene localidades activas, el sistema no lo permitirá.')}"></div>
</div>

</body>
</html>
