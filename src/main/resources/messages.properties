# Mensajes de error de conversión de tipos al enlazar un formulario (por ejemplo, letras en un campo numérico).
# Sin estos, Spring muestra su texto técnico en inglés ("Failed to convert property value ...").
typeMismatch=El valor ingresado no es válido
typeMismatch.java.lang.Integer=Ingrese un número entero válido
typeMismatch.java.lang.Long=Ingrese un número entero válido
typeMismatch.java.lang.Double=Ingrese un número válido
typeMismatch.java.math.BigDecimal=Ingrese un número válido
# OG y FG de la receta: se ingresan con cuatro dígitos (1050 equivale a 1,050)
typeMismatch.version.ogObjetivo=La OG debe tener exactamente cuatro dígitos, por ejemplo 1050 (equivale a 1,050)
typeMismatch.version.fgObjetivo=La FG debe tener exactamente cuatro dígitos, por ejemplo 1010 (equivale a 1,010)
