spring.application.name=MaestroCervecero
server.port=7777
# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# ===================================================================

# URL de conexión: indica el motor (jdbc:postgresql), el servidor (localhost), el puerto (5432) y la BD (mydatabase)
spring.datasource.url=jdbc:postgresql://localhost:5432/maestrocervecero

# Usuario con permisos de acceso a la base de datos
spring.datasource.username=AdminCerveza

# Contraseña del usuario de la base de datos
spring.datasource.password=admin

# Clase del driver JDBC de PostgreSQL (Opcional: Spring Boot 3+ lo deduce automáticamente de la URL)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE (ORM)
# ===================================================================

# Estrategia DDL: Flyway es el único responsable de crear y modificar el esquema (ver db/migration).
# 'validate' hace que Hibernate solo compruebe, al arrancar, que las entidades coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola de la aplicación las consultas SQL que Hibernate ejecuta en tiempo real
spring.jpa.show-sql=true

# Especifica la variante del lenguaje SQL propio de PostgreSQL (Opcional: Spring Boot lo deduce automáticamente)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Carga por lotes de las colecciones y relaciones perezosas: en vez de una consulta por cada versión, malta,
# lúpulo o levadura, Hibernate las trae en grupos de hasta 16 con una sola sentencia (IN). Permite mostrar la
# versión de una receta con una cantidad de sentencias que no depende de cuántos detalles tiene.
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Zona horaria con la que Hibernate escribe y lee las fechas con hora: la misma zona del negocio que fija
# MaestroCerveceroApplication en la JVM, para que las fechas no dependan de la zona del servidor
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# ===================================================================
# MIGRACIONES DE BASE DE DATOS (Flyway)
# ===================================================================

# Flyway aplica al arrancar las migraciones pendientes de classpath:db/migration (V<n>__descripcion.sql).
# Una migración ya aplicada no se edita nunca: Flyway valida su checksum y se niega a arrancar si cambió.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Una base que ya tiene tablas pero no tiene historial de Flyway no se adopta automáticamente: debe recrearse.
spring.flyway.baseline-on-migrate=false

# ===================================================================
# SESIÓN HTTP
# ===================================================================

# Minutos de inactividad antes de que el contenedor invalide la sesión.
# Esta es la propiedad que define la DURACIÓN del timeout; SecurityConfig solo
# define a dónde redirigir cuando esa sesión ya inválida se usa (invalidSessionUrl).
server.servlet.session.timeout=30m

