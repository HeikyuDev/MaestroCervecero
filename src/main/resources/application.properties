spring.application.name=MaestroCervecero
server.port=7777
# ===================================================================
# ENTORNOS (perfiles de Spring)
# ===================================================================

# Este archivo contiene solo la configuración común a todos los entornos. Lo propio de cada uno (URL de la base,
# usuario, clave y si se muestra el SQL) vive en su archivo de perfil:
#   - dev  (application-dev.properties):  trabajo diario y pruebas manuales, base maestrocervecero_dev
#   - prod (application-prod.properties): versión real y de demostración, base maestrocervecero
#   - test (src/test/resources/application-test.properties): reservado para los tests de integración, base maestrocervecero_test
# El perfil se elige con la propiedad spring.profiles.active o con la variable de entorno SPRING_PROFILES_ACTIVE.
# Sin perfil activo se usa dev.
spring.profiles.default=dev

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# ===================================================================

# La URL de conexión, el usuario y la contraseña se definen en el archivo de cada perfil.

# Clase del driver JDBC de PostgreSQL (Opcional: Spring Boot 3+ lo deduce automáticamente de la URL)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE (ORM)
# ===================================================================

# Estrategia DDL: Flyway es el único responsable de crear y modificar el esquema (ver db/migration).
# 'validate' hace que Hibernate solo compruebe, al arrancar, que las entidades coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate

# Especifica la variante del lenguaje SQL propio de PostgreSQL (Opcional: Spring Boot lo deduce automáticamente)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Carga por lotes de las colecciones y relaciones perezosas: en vez de una consulta por cada versión, malta,
# lúpulo o levadura, Hibernate las trae en grupos de hasta 16 con una sola sentencia (IN). Permite mostrar la
# versión de una receta con una cantidad de sentencias que no depende de cuántos detalles tiene.
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Zona horaria con la que Hibernate escribe y lee las fechas con hora: la misma zona del negocio que fija
# MaestroCerveceroApplication en la JVM, para que las fechas no dependan de la zona del servidor
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# ===================================================================
# MIGRACIONES DE BASE DE DATOS (Flyway)
# ===================================================================

# Flyway aplica al arrancar las migraciones pendientes de classpath:db/migration (V<n>__descripcion.sql).
# Una migración ya aplicada no se edita nunca: Flyway valida su checksum y se niega a arrancar si cambió.
# En una base vacía crea el esquema completo y los datos iniciales.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Una base que ya tiene tablas pero no tiene historial de Flyway no se adopta automáticamente: debe recrearse.
spring.flyway.baseline-on-migrate=false

# ===================================================================
# SESIÓN HTTP
# ===================================================================

# Minutos de inactividad antes de que el contenedor invalide la sesión.
# Esta es la propiedad que define la DURACIÓN del timeout; SecurityConfig solo
# define a dónde redirigir cuando esa sesión ya inválida se usa (invalidSessionUrl).
server.servlet.session.timeout=30m

# ===================================================================
# ESTADÍSTICAS
# ===================================================================

# Muestra la pestaña "Tiempos" (y su reporte impreso). Desactivada: el reporte, su Service y sus tests se conservan.
estadisticas.tiempos.habilitada=false

# Muestra la pestaña "Recepción" (y su reporte impreso). Desactivada: el reporte, su Service y sus tests se conservan.
estadisticas.recepcion.habilitada=false

# ===================================================================
# CORREO ELECTRÓNICO (Mailtrap por SMTP)
# ===================================================================

# El servidor SMTP (spring.mail.host y spring.mail.port) se define en el archivo de cada perfil:
#   - dev y test: Mailtrap Email Testing (sandbox), los correos quedan en la bandeja de prueba y no llegan a nadie
#   - prod:       Mailtrap Email Sending, los correos se entregan a los destinatarios reales
# Las credenciales llegan SOLO por variables de entorno y nunca se guardan en el repositorio:
#   - MAILTRAP_USERNAME y MAILTRAP_PASSWORD: en Mailtrap, Email Testing > Inboxes > (bandeja) > SMTP credentials
#     para dev y test; Email Sending > Sending Domains > (dominio) > SMTP para prod.
# Sin ellas la aplicación arranca igual: el envío falla, se registra en el log y nunca se muestra al usuario.
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Límites de espera en milisegundos: un servidor SMTP lento no retiene el hilo de envío indefinidamente
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# El estado del servidor SMTP no forma parte del estado de salud de la aplicación: sin credenciales sigue en servicio
management.health.mail.enabled=false

# Dirección y nombre del remitente de los correos del sistema. En prod la dirección debe pertenecer a un dominio
# verificado en Mailtrap Email Sending (variable de entorno MAIL_REMITENTE).
app.correo.remitente=${MAIL_REMITENTE:no-responder@maestrocervecero.com}
app.correo.nombre-remitente=Maestro Cervecero

# ===================================================================
# ENLACES ENVIADOS POR CORREO
# ===================================================================

# Dirección pública de la aplicación con la que se arman los enlaces de los correos (sin barra final).
# Cada perfil la redefine; en prod se informa con la variable de entorno APP_URL_BASE.
app.url-base=http://localhost:7777

# Minutos de vigencia del enlace para restablecer la contraseña
restablecimiento-contrasena.minutos-vigencia=30

# Minutos que deben pasar desde el último enlace enviado a un usuario para enviarle otro
restablecimiento-contrasena.minutos-entre-solicitudes=2
