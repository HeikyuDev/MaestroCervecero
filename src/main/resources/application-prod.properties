# ===================================================================
# PERFIL DE PRODUCCIÓN (prod)
# ===================================================================
# Versión real y de demostración. Se activa con spring.profiles.active=prod o con la variable de entorno
# SPRING_PROFILES_ACTIVE=prod.
# La URL, el usuario y la clave se pueden reemplazar con las variables de entorno SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD; sin ellas se usan los valores por defecto.

# URL de conexión: indica el motor (jdbc:postgresql), el servidor (localhost), el puerto (5432) y la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maestrocervecero}

# Usuario con permisos de acceso a la base de datos
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:AdminCerveza}

# Contraseña del usuario de la base de datos
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# No muestra en la consola las consultas SQL que ejecuta Hibernate
spring.jpa.show-sql=false
