name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maestrocervecero
          POSTGRES_USER: AdminCerveza
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U AdminCerveza -d maestrocervecero"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Todos los tests son unitarios y no usan base de datos. El perfil "test"
      # (src/test/resources/application-test.properties) y la base vacia que crea el servicio postgres de este job quedan
      # preparados para los tests de integracion; SPRING_PROFILES_ACTIVE evita que un contexto de Spring use el perfil
      # por defecto "dev".
      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/maestrocervecero
